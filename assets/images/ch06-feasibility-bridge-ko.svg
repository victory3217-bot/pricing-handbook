<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 594" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">가격전략에서 사업타당성으로</title>
  <desc id="d">가격 P, 비용·마진 구조, 수익모델은 병렬로 정리되는 세 입력값이며, 세 재무 렌즈(손익, 자산, 현금흐름)로 교차 점검한 뒤 사업타당성(P × Qty)으로 넘긴다.</desc>
  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#14253D"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C49A5A"/>
    </marker>
  </defs>
  <g id="background">
    <rect width="480" height="594" rx="14" fill="#F6F2EA"/>
  </g>
  <g id="headline">
    <text x="240" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">가격전략 → 사업타당성</text>
  </g>
  <g id="inputs">
  <g id="price-p">
    <rect x="24" y="75" width="136" height="132" rx="10" fill="#315B62"/>
    <text x="92" y="125" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">가격 P</text>
    <text x="92" y="149" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">고객과 가치의</text>
    <text x="92" y="172" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">근거</text>
  </g>
  <g id="cost-margin">
    <rect x="172" y="75" width="136" height="132" rx="10" fill="#315B62"/>
    <text x="240" y="123" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">비용 · 마진</text>
    <text x="240" y="150" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">구조</text>
    <text x="240" y="174" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">지속 가능성</text>
  </g>
  <g id="revenue-model">
    <rect x="320" y="75" width="136" height="132" rx="10" fill="#315B62"/>
    <text x="388" y="125" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">수익모델</text>
    <text x="388" y="149" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">누가 무엇에</text>
    <text x="388" y="172" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">어떻게 지불?</text>
  </g>
  </g>
  <g id="flow">
    <line x1="92" y1="209" x2="92" y2="256" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <line x1="240" y1="209" x2="240" y2="256" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <line x1="388" y1="209" x2="388" y2="256" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <line x1="240" y1="412" x2="240" y2="443" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
  </g>
  <g id="three-lenses">
    <rect x="40" y="259" width="400" height="151" rx="10" fill="#14253D"/>
    <text x="240" y="319" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">세 재무 렌즈로 교차 점검</text>
    <text x="240" y="342" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">손익 · 자산 · 현금흐름</text>
    <text x="240" y="365" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">서로 다른 경제적 구조를 함께 확인</text>
  </g>
  <g id="feasibility">
    <rect x="40" y="446" width="400" height="120" rx="10" fill="#C49A5A"/>
    <text x="240" y="488" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">사업타당성</text>
    <text x="240" y="515" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">P × Qty</text>
    <text x="240" y="539" text-anchor="middle" font-size="17" font-weight="400" fill="#252A30">실제로 얼마나 팔 수 있는가?</text>
  </g>
</svg>
