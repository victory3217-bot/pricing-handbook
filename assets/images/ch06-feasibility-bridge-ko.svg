<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 725" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">가격전략에서 사업타당성으로</title>
  <desc id="d">가격, 비용과 마진, 수익모델을 세 재무 렌즈로 검토해 사업타당성으로 연결한다.</desc>
  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#14253D"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C49A5A"/>
    </marker>
  </defs>
  <g id="background">
    <rect width="480" height="725" rx="14" fill="#F6F2EA"/>
  </g>
  <g id="headline">
    <text x="240" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">가격전략 → 사업타당성</text>
  </g>
  <g id="price-p">
    <rect x="40" y="75" width="400" height="78" rx="10" fill="#315B62"/>
    <text x="240" y="110" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">가격 P</text>
    <text x="240" y="133" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">고객과 가치의 근거</text>
  </g>
  <g id="cost-margin">
    <rect x="40" y="189" width="400" height="78" rx="10" fill="#315B62"/>
    <text x="240" y="224" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">비용 · 마진 구조</text>
    <text x="240" y="247" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">지속 가능성</text>
  </g>
  <g id="revenue-model">
    <rect x="40" y="303" width="400" height="78" rx="10" fill="#315B62"/>
    <text x="240" y="338" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">수익모델</text>
    <text x="240" y="361" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">누가 무엇에 어떻게 지불?</text>
  </g>
  <g id="three-lenses">
    <rect x="40" y="417" width="400" height="124" rx="10" fill="#14253D"/>
    <text x="240" y="463" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">세 재무 렌즈</text>
    <text x="240" y="487" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">손익 · 자산 · 현금흐름</text>
    <text x="240" y="510" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">서로 다른 경제적 구조를 함께 확인</text>
  </g>
  <g id="feasibility">
    <rect x="40" y="577" width="400" height="120" rx="10" fill="#C49A5A"/>
    <text x="240" y="619" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">사업타당성</text>
    <text x="240" y="646" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">P × Qty</text>
    <text x="240" y="670" text-anchor="middle" font-size="17" font-weight="400" fill="#252A30">실제로 얼마나 팔 수 있는가?</text>
  </g>
  <g id="flow">
    <line x1="240" y1="155" x2="240" y2="186" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <line x1="240" y1="269" x2="240" y2="300" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <line x1="240" y1="383" x2="240" y2="414" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <line x1="240" y1="543" x2="240" y2="574" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
  </g>
</svg>
