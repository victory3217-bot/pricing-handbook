<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 760" role="img" aria-labelledby="t d"><title id="t">가격전략에서 사업타당성으로</title><desc id="d">가격, 비용과 마진, 수익모델을 세 재무 렌즈로 검토해 사업타당성으로 연결한다.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#475569"/></marker></defs><style>text{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;fill:#0f172a}.h{font-size:21px;font-weight:700}.s{font-size:16px;fill:#475569}.i{fill:#eef2ff;stroke:#6366f1;stroke-width:2}.l{fill:#ecfdf5;stroke:#059669;stroke-width:2}.o{fill:#fef3c7;stroke:#d97706;stroke-width:3}.a{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#a)}</style><rect width="440" height="760" rx="16" fill="#fff"/><text class="h" x="220" y="38" text-anchor="middle">가격전략 → 사업타당성</text><g text-anchor="middle"><rect class="i" x="30" y="70" width="380" height="72" rx="12"/><text class="h" x="220" y="100">가격 P</text><text class="s" x="220" y="126">고객과 가치의 근거</text><rect class="i" x="30" y="165" width="380" height="72" rx="12"/><text class="h" x="220" y="195">비용 · 마진 구조</text><text class="s" x="220" y="221">지속 가능성</text><rect class="i" x="30" y="260" width="380" height="72" rx="12"/><text class="h" x="220" y="290">수익모델</text><text class="s" x="220" y="316">누가 무엇에 어떻게 지불?</text><rect class="l" x="30" y="395" width="380" height="110" rx="12"/><text class="h" x="220" y="430">세 재무 렌즈</text><text class="s" x="220" y="462">손익 · 자산 · 현금흐름</text><text class="s" x="220" y="488">서로 다른 경제적 구조를 함께 확인</text><rect class="o" x="30" y="570" width="380" height="120" rx="14"/><text class="h" x="220" y="612">사업타당성</text><text class="h" x="220" y="646">P × Qty</text><text class="s" x="220" y="674">실제로 얼마나 팔 수 있는가?</text></g><path class="a" d="M220 142v23M220 237v23M220 332v63M220 505v65"/></svg>
