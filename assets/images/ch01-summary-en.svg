<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 702" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">CH01 Summary: Price Is the Outcome of the Business Model</title>
  <desc id="d">Price is not a number added at the end; it is the outcome of a business model aligning customer, value, delivery, and cost. 1. Customer: Who are we selling to?. 2. Value: Why does the customer pay?. 3. Delivery: Through which channel and method?. 4. Cost: What does that delivery cost?. Check question: Does this price fit all four?</desc>
  <g id="background">
    <rect width="480" height="702" rx="14" fill="#F6F2EA"/>
  </g>
  <g id="summary">
    <rect x="24" y="24" width="432" height="104" rx="10" fill="#14253D"/>
    <text x="38" y="50" text-anchor="start" font-size="14" font-weight="700" fill="#C49A5A">CH01</text>
    <text x="38" y="74" text-anchor="start" font-size="20" font-weight="700" fill="#FFFFFF">Price Is the Outcome</text>
    <text x="38" y="101" text-anchor="start" font-size="20" font-weight="700" fill="#FFFFFF">of the Business Model</text>
    <rect x="24" y="142" width="432" height="144" rx="10" fill="#315B62"/>
    <text x="38" y="164" text-anchor="start" font-size="13" font-weight="700" fill="#C49A5A">Key message</text>
    <text x="38" y="186" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">Price is not a number added at</text>
    <text x="38" y="210" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">the end; it is the outcome of a</text>
    <text x="38" y="234" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">business model aligning customer,</text>
    <text x="38" y="258" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">value, delivery, and cost.</text>
    <rect x="24" y="300" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="333.5" r="15" fill="#C49A5A"/>
    <text x="52" y="339.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">1</text>
    <text x="80" y="326" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Customer</text>
    <text x="80" y="346" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">Who are we selling to?</text>
    <rect x="24" y="377" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="410.5" r="15" fill="#C49A5A"/>
    <text x="52" y="416.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">2</text>
    <text x="80" y="403" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Value</text>
    <text x="80" y="423" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">Why does the customer pay?</text>
    <rect x="24" y="454" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="487.5" r="15" fill="#C49A5A"/>
    <text x="52" y="493.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">3</text>
    <text x="80" y="480" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Delivery</text>
    <text x="80" y="500" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">Through which channel and method?</text>
    <rect x="24" y="531" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="564.5" r="15" fill="#C49A5A"/>
    <text x="52" y="570.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">4</text>
    <text x="80" y="557" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Cost</text>
    <text x="80" y="577" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">What does that delivery cost?</text>
    <rect x="24" y="612" width="432" height="66" rx="10" fill="#C49A5A"/>
    <text x="38" y="634" text-anchor="start" font-size="13" font-weight="700" fill="#252A30">Check question</text>
    <text x="38" y="652" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Does this price fit all four?</text>
  </g>
</svg>
