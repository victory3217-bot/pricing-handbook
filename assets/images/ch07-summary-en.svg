<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 726" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">CH07 Summary: The Effective Market and My Market</title>
  <desc id="d">The effective market is not an arbitrary slice of the total market; it is the market the price and business model can realistically reach. 1. Total market: The market that exists in theory. 2. Buyer-based: Redefine around actual paying buyers. 3. Constraints: Apply price and business-model limits. 4. Effective → my market: The share I can actually reach. Check question: Are any unsupported market numbers mixed in?</desc>
  <g id="background">
    <rect width="480" height="726" rx="14" fill="#F6F2EA"/>
  </g>
  <g id="summary">
    <rect x="24" y="24" width="432" height="104" rx="10" fill="#14253D"/>
    <text x="38" y="50" text-anchor="start" font-size="14" font-weight="700" fill="#C49A5A">CH07</text>
    <text x="38" y="74" text-anchor="start" font-size="20" font-weight="700" fill="#FFFFFF">The Effective</text>
    <text x="38" y="101" text-anchor="start" font-size="20" font-weight="700" fill="#FFFFFF">Market and My Market</text>
    <rect x="24" y="142" width="432" height="144" rx="10" fill="#315B62"/>
    <text x="38" y="164" text-anchor="start" font-size="13" font-weight="700" fill="#C49A5A">Key message</text>
    <text x="38" y="186" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">The effective market is not an</text>
    <text x="38" y="210" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">arbitrary slice of the total market;</text>
    <text x="38" y="234" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">it is the market the price and</text>
    <text x="38" y="258" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">business model can realistically reach.</text>
    <rect x="24" y="300" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="333.5" r="15" fill="#C49A5A"/>
    <text x="52" y="339.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">1</text>
    <text x="80" y="326" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Total market</text>
    <text x="80" y="346" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">The market that exists in theory</text>
    <rect x="24" y="377" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="410.5" r="15" fill="#C49A5A"/>
    <text x="52" y="416.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">2</text>
    <text x="80" y="403" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Buyer-based</text>
    <text x="80" y="423" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">Redefine around actual paying buyers</text>
    <rect x="24" y="454" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="487.5" r="15" fill="#C49A5A"/>
    <text x="52" y="493.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">3</text>
    <text x="80" y="480" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Constraints</text>
    <text x="80" y="500" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">Apply price and business-model limits</text>
    <rect x="24" y="531" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="564.5" r="15" fill="#C49A5A"/>
    <text x="52" y="570.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">4</text>
    <text x="80" y="557" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Effective → my market</text>
    <text x="80" y="577" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">The share I can actually reach</text>
    <rect x="24" y="612" width="432" height="90" rx="10" fill="#C49A5A"/>
    <text x="38" y="634" text-anchor="start" font-size="13" font-weight="700" fill="#252A30">Check question</text>
    <text x="38" y="652" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Are any unsupported</text>
    <text x="38" y="676" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">market numbers mixed in?</text>
  </g>
</svg>
