<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 720" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">CH10 Summary: MODE A — Current Price Diagnosis</title>
  <desc id="d">Judge the health of the current price by contribution margin after variable selling and delivery costs, not by gross profit alone. 1. Inputs: Price, tax, costs, unconfirmed items. 2. Gross profit: Reflects direct cost only. 3. Contribution margin: Also reflects variable selling and delivery. 4. Status values: Read calculability and warnings first. Check question: Are unconfirmed inputs shaking the result?</desc>
  <g id="background">
    <rect width="480" height="720" rx="14" fill="#F6F2EA"/>
  </g>
  <g id="summary">
    <rect x="24" y="24" width="432" height="77" rx="10" fill="#14253D"/>
    <text x="38" y="50" text-anchor="start" font-size="14" font-weight="700" fill="#C49A5A">CH10</text>
    <text x="38" y="74" text-anchor="start" font-size="20" font-weight="700" fill="#FFFFFF">MODE A — Current Price Diagnosis</text>
    <rect x="24" y="115" width="432" height="144" rx="10" fill="#315B62"/>
    <text x="38" y="137" text-anchor="start" font-size="13" font-weight="700" fill="#C49A5A">Key message</text>
    <text x="38" y="159" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">Judge the health of the current</text>
    <text x="38" y="183" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">price by contribution margin after</text>
    <text x="38" y="207" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">variable selling and delivery</text>
    <text x="38" y="231" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">costs, not by gross profit alone.</text>
    <rect x="24" y="273" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="306.5" r="15" fill="#C49A5A"/>
    <text x="52" y="312.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">1</text>
    <text x="80" y="299" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Inputs</text>
    <text x="80" y="319" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">Price, tax, costs, unconfirmed items</text>
    <rect x="24" y="350" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="383.5" r="15" fill="#C49A5A"/>
    <text x="52" y="389.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">2</text>
    <text x="80" y="376" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Gross profit</text>
    <text x="80" y="396" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">Reflects direct cost only</text>
    <rect x="24" y="427" width="432" height="88" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="471" r="15" fill="#C49A5A"/>
    <text x="52" y="477" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">3</text>
    <text x="80" y="453" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Contribution margin</text>
    <text x="80" y="473" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">Also reflects variable</text>
    <text x="80" y="494" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">selling and delivery</text>
    <rect x="24" y="525" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="558.5" r="15" fill="#C49A5A"/>
    <text x="52" y="564.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">4</text>
    <text x="80" y="551" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Status values</text>
    <text x="80" y="571" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">Read calculability and warnings first</text>
    <rect x="24" y="606" width="432" height="90" rx="10" fill="#C49A5A"/>
    <text x="38" y="628" text-anchor="start" font-size="13" font-weight="700" fill="#252A30">Check question</text>
    <text x="38" y="646" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Are unconfirmed inputs</text>
    <text x="38" y="670" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">shaking the result?</text>
  </g>
</svg>
