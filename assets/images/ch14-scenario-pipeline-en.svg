<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 907" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">Scenario comparison pipeline</title>
  <desc id="d">Baseline and overrides are merged and validated, four engines run, and deltas are calculated.</desc>
  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#14253D"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C49A5A"/>
    </marker>
  </defs>
  <g id="background">
    <rect width="480" height="907" rx="14" fill="#F6F2EA"/>
  </g>
  <g id="headline">
    <text x="240" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">Hold the baseline;</text>
    <text x="240" y="71" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">compare changes</text>
  </g>
  <g id="preflight">
    <rect x="40" y="102" width="400" height="78" rx="10" fill="#315B62"/>
    <text x="240" y="137" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">1. Request preflight</text>
    <text x="240" y="160" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">Duplicates · targets · baseline</text>
  </g>
  <g id="merge">
    <rect x="40" y="216" width="400" height="78" rx="10" fill="#315B62"/>
    <text x="240" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">2. Merge base + override</text>
    <text x="240" y="274" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">Replace only changed fields</text>
  </g>
  <g id="validate">
    <rect x="40" y="330" width="400" height="78" rx="10" fill="#315B62"/>
    <text x="240" y="365" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">3. Validate each scenario</text>
    <text x="240" y="388" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">Errors stay with that scenario</text>
  </g>
  <g id="engines">
    <rect x="40" y="444" width="400" height="101" rx="10" fill="#14253D"/>
    <text x="240" y="479" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">4. Run four engines</text>
    <text x="240" y="502" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">MODE A · MODE B · MODE C · BEP</text>
    <text x="240" y="525" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">Run all four for every scenario</text>
  </g>
  <g id="summary">
    <rect x="40" y="581" width="400" height="78" rx="10" fill="#315B62"/>
    <text x="240" y="616" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">5. Summarize results</text>
    <text x="240" y="639" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">Read-only view of module outputs</text>
  </g>
  <g id="delta">
    <rect x="40" y="695" width="400" height="100" rx="10" fill="#C49A5A"/>
    <text x="240" y="741" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">6. Δ vs baseline</text>
    <text x="240" y="764" text-anchor="middle" font-size="17" font-weight="400" fill="#252A30">Net sales · CM · CM rate · BEP</text>
  </g>
  <g id="flow">
    <line x1="240" y1="182" x2="240" y2="213" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <line x1="240" y1="296" x2="240" y2="327" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <line x1="240" y1="410" x2="240" y2="441" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <line x1="240" y1="547" x2="240" y2="578" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <line x1="240" y1="661" x2="240" y2="692" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
  </g>
  <g id="caption">
    <text x="240" y="839" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">Compare numbers;</text>
    <text x="240" y="866" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">don't name a “best”</text>
  </g>
</svg>
