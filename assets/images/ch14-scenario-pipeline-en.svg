<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 930" role="img" aria-labelledby="t d"><title id="t">Scenario comparison pipeline</title><desc id="d">Baseline and overrides are merged and validated, four engines run, and deltas are calculated.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#475569"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#0f172a}.h{font-size:20px;font-weight:700}.s{font-size:16px;fill:#475569}.b{fill:#eef2ff;stroke:#6366f1;stroke-width:2}.e{fill:#ecfdf5;stroke:#059669;stroke-width:2}.o{fill:#fef3c7;stroke:#d97706;stroke-width:3}.l{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#a)}</style><rect width="440" height="930" rx="16" fill="#fff"/><text class="h" x="220" y="36" text-anchor="middle">Hold the baseline; compare changes</text><g text-anchor="middle"><rect class="b" x="30" y="70" width="380" height="82" rx="12"/><text class="h" x="220" y="103">1. Request preflight</text><text class="s" x="220" y="132">Duplicates · targets · baseline</text><rect class="b" x="30" y="185" width="380" height="82" rx="12"/><text class="h" x="220" y="218">2. Merge base + override</text><text class="s" x="220" y="247">Replace only changed fields</text><rect class="b" x="30" y="300" width="380" height="82" rx="12"/><text class="h" x="220" y="333">3. Validate each scenario</text><text class="s" x="220" y="362">Errors stay with that scenario</text><rect class="e" x="30" y="415" width="380" height="105" rx="12"/><text class="h" x="220" y="448">4. Run four engines</text><text class="s" x="220" y="478">MODE A · MODE B · MODE C · BEP</text><text class="s" x="220" y="502">Run all four for every scenario</text><rect class="b" x="30" y="555" width="380" height="82" rx="12"/><text class="h" x="220" y="588">5. Summarize results</text><text class="s" x="220" y="617">Read-only view of module outputs</text><rect class="o" x="30" y="670" width="380" height="100" rx="14"/><text class="h" x="220" y="707">6. Δ vs baseline</text><text class="s" x="220" y="739">Net sales · CM · CM rate · BEP</text></g><path class="l" d="M220 152v33M220 267v33M220 382v33M220 520v35M220 637v33"/><text class="h" x="220" y="835" text-anchor="middle" fill="#b45309">Compare numbers; don't name a “best”</text></svg>
