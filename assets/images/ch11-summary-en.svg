<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 810" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">CH11 Summary: MODE B — Target Price Reverse Calculation</title>
  <desc id="d">Target-price reverse calculation translates a desired margin into price and reveals whether the current cost structure can support it. 1. Target: Set the target contribution margin rate t. 2. Cost types: Fixed amount, net-sales rate, gross-payment rate. 3. Reverse calculate: Find required net sales and displayed price. 4. Interpret: Whether the market accepts it is a separate judgment. Check question: Can we state where the target rate comes from?</desc>
  <g id="background">
    <rect width="480" height="810" rx="14" fill="#F6F2EA"/>
  </g>
  <g id="summary">
    <rect x="24" y="24" width="432" height="104" rx="10" fill="#14253D"/>
    <text x="38" y="50" text-anchor="start" font-size="14" font-weight="700" fill="#C49A5A">CH11</text>
    <text x="38" y="74" text-anchor="start" font-size="20" font-weight="700" fill="#FFFFFF">MODE B — Target Price</text>
    <text x="38" y="101" text-anchor="start" font-size="20" font-weight="700" fill="#FFFFFF">Reverse Calculation</text>
    <rect x="24" y="142" width="432" height="144" rx="10" fill="#315B62"/>
    <text x="38" y="164" text-anchor="start" font-size="13" font-weight="700" fill="#C49A5A">Key message</text>
    <text x="38" y="186" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">Target-price reverse calculation</text>
    <text x="38" y="210" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">translates a desired margin into</text>
    <text x="38" y="234" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">price and reveals whether the current</text>
    <text x="38" y="258" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">cost structure can support it.</text>
    <rect x="24" y="300" width="432" height="88" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="344" r="15" fill="#C49A5A"/>
    <text x="52" y="350" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">1</text>
    <text x="80" y="326" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Target</text>
    <text x="80" y="346" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">Set the target</text>
    <text x="80" y="367" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">contribution margin rate t</text>
    <rect x="24" y="398" width="432" height="88" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="442" r="15" fill="#C49A5A"/>
    <text x="52" y="448" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">2</text>
    <text x="80" y="424" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Cost types</text>
    <text x="80" y="444" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">Fixed amount, net-sales</text>
    <text x="80" y="465" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">rate, gross-payment rate</text>
    <rect x="24" y="496" width="432" height="88" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="540" r="15" fill="#C49A5A"/>
    <text x="52" y="546" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">3</text>
    <text x="80" y="522" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Reverse calculate</text>
    <text x="80" y="542" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">Find required net sales</text>
    <text x="80" y="563" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">and displayed price</text>
    <rect x="24" y="594" width="432" height="88" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="638" r="15" fill="#C49A5A"/>
    <text x="52" y="644" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">4</text>
    <text x="80" y="620" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Interpret</text>
    <text x="80" y="640" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">Whether the market accepts</text>
    <text x="80" y="661" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">it is a separate judgment</text>
    <rect x="24" y="696" width="432" height="90" rx="10" fill="#C49A5A"/>
