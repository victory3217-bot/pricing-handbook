<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 627" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">CH09 요약: QCD·추정손익 해석과 반복검증</title>
  <desc id="d">QCD와 추정손익은 채점표가 아니라, 실행 불가능한 가정을 찾아 다시 설계하게 하는 피드백이다. 1. Quality: 요구 수준의 제품을 실제로 만들 수 있는가. 2. Delivery: 원하는 규모와 시점에 공급할 수 있는가. 3. Cost: 감당 가능한 비용으로 만들 수 있는가. 4. 반복검증: 안 되는 가정은 고쳐서 다시 계산. 체크 질문: 세 가지 중 하나라도 막히면 가설을 고쳤는가?</desc>
  <g id="background">
    <rect width="480" height="627" rx="14" fill="#F6F2EA"/>
  </g>
  <g id="summary">
    <rect x="24" y="24" width="432" height="77" rx="10" fill="#14253D"/>
    <text x="38" y="50" text-anchor="start" font-size="14" font-weight="700" fill="#C49A5A">CH09</text>
    <text x="38" y="74" text-anchor="start" font-size="20" font-weight="700" fill="#FFFFFF">QCD·추정손익 해석과 반복검증</text>
    <rect x="24" y="115" width="432" height="96" rx="10" fill="#315B62"/>
    <text x="38" y="137" text-anchor="start" font-size="13" font-weight="700" fill="#C49A5A">핵심 메시지</text>
    <text x="38" y="159" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">QCD와 추정손익은 채점표가 아니라, 실행 불가능</text>
    <text x="38" y="183" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">한 가정을 찾아 다시 설계하게 하는 피드백이다.</text>
    <rect x="24" y="225" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="258.5" r="15" fill="#C49A5A"/>
    <text x="52" y="264.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">1</text>
    <text x="80" y="251" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Quality</text>
    <text x="80" y="271" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">요구 수준의 제품을 실제로 만들 수 있는가</text>
    <rect x="24" y="302" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="335.5" r="15" fill="#C49A5A"/>
    <text x="52" y="341.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">2</text>
    <text x="80" y="328" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Delivery</text>
    <text x="80" y="348" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">원하는 규모와 시점에 공급할 수 있는가</text>
    <rect x="24" y="379" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="412.5" r="15" fill="#C49A5A"/>
    <text x="52" y="418.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">3</text>
    <text x="80" y="405" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Cost</text>
    <text x="80" y="425" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">감당 가능한 비용으로 만들 수 있는가</text>
    <rect x="24" y="456" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="489.5" r="15" fill="#C49A5A"/>
    <text x="52" y="495.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">4</text>
    <text x="80" y="482" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">반복검증</text>
    <text x="80" y="502" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">안 되는 가정은 고쳐서 다시 계산</text>
    <rect x="24" y="537" width="432" height="66" rx="10" fill="#C49A5A"/>
    <text x="38" y="559" text-anchor="start" font-size="13" font-weight="700" fill="#252A30">체크 질문</text>
    <text x="38" y="577" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">세 가지 중 하나라도 막히면 가설을 고쳤는가?</text>
  </g>
</svg>
