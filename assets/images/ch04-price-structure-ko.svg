<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 784" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">가격구조를 바꾸는 요소</title>
  <desc id="d">목표 고객, 채널, 고객관계 비용, 원가와 목표 마진이 함께 가격구조로 모이고, 모두 반영한 뒤에도 목표 마진이 남는지 검토한다.</desc>
  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#14253D"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C49A5A"/>
    </marker>
  </defs>
  <g id="background">
    <rect width="480" height="784" rx="14" fill="#F6F2EA"/>
  </g>
  <g id="headline">
    <text x="240" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">가격구조를 바꾸는 요소</text>
  </g>
  <g id="target-customer">
    <rect x="40" y="75" width="400" height="101" rx="10" fill="#315B62"/>
    <text x="240" y="121" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">목표 고객</text>
    <text x="240" y="145" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">특정 가격은 특정 고객을 전제로 한다</text>
  </g>
  <g id="channel">
    <rect x="40" y="220" width="400" height="101" rx="10" fill="#315B62"/>
    <text x="240" y="266" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">채널 (직접 vs 간접)</text>
    <text x="240" y="290" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">수수료 · 유통마진 · 운영부담</text>
  </g>
  <g id="relationship-cost">
    <rect x="40" y="365" width="400" height="78" rx="10" fill="#315B62"/>
    <text x="240" y="400" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">고객관계 비용</text>
    <text x="240" y="423" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">획득 · 유지 · 재구매</text>
  </g>
  <g id="cost-margin">
    <rect x="40" y="487" width="400" height="78" rx="10" fill="#315B62"/>
    <text x="240" y="522" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">원가 · 목표 마진</text>
    <text x="240" y="545" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">가격구조의 기본 요소</text>
  </g>
  <g id="price-structure">
    <rect x="40" y="609" width="400" height="147" rx="10" fill="#C49A5A"/>
    <text x="240" y="667" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">가격구조</text>
    <text x="240" y="690" text-anchor="middle" font-size="17" font-weight="400" fill="#252A30">모두 반영한 뒤에도 목표 마진이 남는가?</text>
    <text x="240" y="713" text-anchor="middle" font-size="17" font-weight="400" fill="#252A30">남지 않으면 채널 · 가격 · 관계 운영을 조정</text>
  </g>
  <g id="flow">
    <text x="240" y="208" text-anchor="middle" font-size="30" font-weight="700" fill="#252A30">+</text>
    <text x="240" y="353" text-anchor="middle" font-size="30" font-weight="700" fill="#252A30">+</text>
    <text x="240" y="475" text-anchor="middle" font-size="30" font-weight="700" fill="#252A30">+</text>
    <line x1="240" y1="567" x2="240" y2="606" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
  </g>
</svg>
