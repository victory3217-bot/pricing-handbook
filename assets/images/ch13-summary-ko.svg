<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 672" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">CH13 요약: BEP — 손익분기점</title>
  <desc id="d">단위당 이익이 플러스여도, 그 이익으로 고정비를 회수할 판매량을 달성할 수 있어야 사업이 성립한다. 1. CMu: 단위당 공헌이익 = 순매출 − 직접원가 − 변동비. 2. FC: 고정운영비의 합. 3. Q_BEP: 손익분기 판매량 = FC ÷ CMu. 4. 판매량 손익: 계획 판매량에서 이익이 나는지 확인. 체크 질문: 계획 판매량이 손익분기 판매량을 넘는가?</desc>
  <g id="background">
    <rect width="480" height="672" rx="14" fill="#F6F2EA"/>
  </g>
  <g id="summary">
    <rect x="24" y="24" width="432" height="77" rx="10" fill="#14253D"/>
    <text x="38" y="50" text-anchor="start" font-size="14" font-weight="700" fill="#C49A5A">CH13</text>
    <text x="38" y="74" text-anchor="start" font-size="20" font-weight="700" fill="#FFFFFF">BEP — 손익분기점</text>
    <rect x="24" y="115" width="432" height="120" rx="10" fill="#315B62"/>
    <text x="38" y="137" text-anchor="start" font-size="13" font-weight="700" fill="#C49A5A">핵심 메시지</text>
    <text x="38" y="159" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">단위당 이익이 플러스여도, 그 이익</text>
    <text x="38" y="183" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">으로 고정비를 회수할 판매량을 달</text>
    <text x="38" y="207" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">성할 수 있어야 사업이 성립한다.</text>
    <rect x="24" y="249" width="432" height="88" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="293" r="15" fill="#C49A5A"/>
    <text x="52" y="299" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">1</text>
    <text x="80" y="275" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">CMu</text>
    <text x="80" y="295" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">단위당 공헌이익 = 순매출</text>
    <text x="80" y="316" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">− 직접원가 − 변동비</text>
    <rect x="24" y="347" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="380.5" r="15" fill="#C49A5A"/>
    <text x="52" y="386.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">2</text>
    <text x="80" y="373" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">FC</text>
    <text x="80" y="393" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">고정운영비의 합</text>
    <rect x="24" y="424" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="457.5" r="15" fill="#C49A5A"/>
    <text x="52" y="463.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">3</text>
    <text x="80" y="450" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Q_BEP</text>
    <text x="80" y="470" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">손익분기 판매량 = FC ÷ CMu</text>
    <rect x="24" y="501" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="534.5" r="15" fill="#C49A5A"/>
    <text x="52" y="540.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">4</text>
    <text x="80" y="527" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">판매량 손익</text>
    <text x="80" y="547" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">계획 판매량에서 이익이 나는지 확인</text>
    <rect x="24" y="582" width="432" height="66" rx="10" fill="#C49A5A"/>
    <text x="38" y="604" text-anchor="start" font-size="13" font-weight="700" fill="#252A30">체크 질문</text>
    <text x="38" y="622" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">계획 판매량이 손익분기 판매량을 넘는가?</text>
  </g>
</svg>
