<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 732" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">Price is the outcome of the business model</title>
  <desc id="d">Price is a structure in which several questions overlap: who is buying, why they are buying, where they are buying, what we must do, how much doing that costs, and how it compares to which competitors. Price is the outcome in which the provisional answers to these questions are gathered as a number. It is a consistency check and a positioning signal, and it reinforces market perception.</desc>
  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#14253D"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C49A5A"/>
    </marker>
  </defs>
  <g id="background">
    <rect width="480" height="732" rx="14" fill="#F6F2EA"/>
  </g>
  <g id="headline">
    <text x="240" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">Business-model answers meet in price</text>
  </g>
  <g id="questions">
  <g id="customer">
    <rect x="40" y="75" width="192" height="124" rx="10" fill="#315B62"/>
    <text x="136" y="133" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Customer</text>
    <text x="136" y="156" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">Who is buying?</text>
  </g>
  <g id="value">
    <rect x="248" y="75" width="192" height="124" rx="10" fill="#315B62"/>
    <text x="344" y="121" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Value</text>
    <text x="344" y="145" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">Why are they</text>
    <text x="344" y="168" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">buying?</text>
  </g>
  <g id="delivery">
    <rect x="40" y="213" width="192" height="124" rx="10" fill="#315B62"/>
    <text x="136" y="259" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Delivery</text>
    <text x="136" y="283" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">Where are they</text>
    <text x="136" y="306" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">buying?</text>
  </g>
  <g id="activities">
    <rect x="248" y="213" width="192" height="124" rx="10" fill="#315B62"/>
    <text x="344" y="271" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Activities</text>
    <text x="344" y="294" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">What must we do?</text>
  </g>
  <g id="cost">
    <rect x="40" y="351" width="192" height="124" rx="10" fill="#315B62"/>
    <text x="136" y="397" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Cost</text>
    <text x="136" y="421" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">How much does</text>
    <text x="136" y="444" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">doing that cost?</text>
  </g>
  <g id="competition">
    <rect x="248" y="351" width="192" height="124" rx="10" fill="#315B62"/>
    <text x="344" y="386" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Competition</text>
    <text x="344" y="409" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">How does this</text>
    <text x="344" y="432" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">compare to which</text>
    <text x="344" y="455" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">competitors?</text>
  </g>
  </g>
  <g id="flow">
    <line x1="240" y1="477" x2="240" y2="520" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
  </g>
  <g id="price">
    <rect x="40" y="523" width="400" height="124" rx="10" fill="#C49A5A"/>
    <text x="240" y="558" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">PRICE</text>
    <text x="240" y="581" text-anchor="middle" font-size="17" font-weight="400" fill="#252A30">Provisional answers to these</text>
    <text x="240" y="604" text-anchor="middle" font-size="17" font-weight="400" fill="#252A30">questions, gathered as a number</text>
    <text x="240" y="627" text-anchor="middle" font-size="17" font-weight="400" fill="#252A30">Consistency check · positioning signal</text>
  </g>
  <g id="caption">
    <text x="240" y="691" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">Price reinforces market perception</text>
  </g>
</svg>
