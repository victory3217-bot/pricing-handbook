<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 720" role="img" aria-labelledby="t d"><title id="t">Price is the outcome of the business model</title><desc id="d">Customer, value, delivery, cost, and competition converge into price.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#475569"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#0f172a}.h{font-size:21px;font-weight:700}.s{font-size:16px;fill:#475569}.b{fill:#eef2ff;stroke:#6366f1;stroke-width:2}.p{fill:#fef3c7;stroke:#d97706;stroke-width:3}.l{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#a)}</style><rect width="440" height="720" rx="16" fill="#fff"/><text class="h" x="220" y="38" text-anchor="middle">Business-model answers meet in price</text><g text-anchor="middle"><rect class="b" x="30" y="70" width="380" height="82" rx="12"/><text class="h" x="220" y="104">Customer</text><text class="s" x="220" y="132">Who buys?</text><rect class="b" x="30" y="180" width="380" height="82" rx="12"/><text class="h" x="220" y="214">Value</text><text class="s" x="220" y="242">Why buy?</text><rect class="b" x="30" y="290" width="380" height="82" rx="12"/><text class="h" x="220" y="324">Delivery</text><text class="s" x="220" y="352">Where do they buy?</text><rect class="b" x="30" y="400" width="380" height="82" rx="12"/><text class="h" x="220" y="434">Cost · competition</text><text class="s" x="220" y="462">What does it take and compare with?</text><rect class="p" x="30" y="545" width="380" height="105" rx="14"/><text class="h" x="220" y="588">PRICE</text><text class="s" x="220" y="619">Outcome of fit · positioning signal</text></g><path class="l" d="M220 152v28M220 262v28M220 372v28M220 482v63"/><text class="s" x="220" y="690" text-anchor="middle">Price reinforces market perception</text></svg>
