<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 716" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">Price is the outcome of the business model</title>
  <desc id="d">Customer, value, delivery, cost, and competition converge into price.</desc>
  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#14253D"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C49A5A"/>
    </marker>
  </defs>
  <g id="background">
    <rect width="480" height="716" rx="14" fill="#F6F2EA"/>
  </g>
  <g id="headline">
    <text x="240" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">Business-model answers meet in price</text>
  </g>
  <g id="customer">
    <rect x="40" y="75" width="400" height="78" rx="10" fill="#315B62"/>
    <text x="240" y="110" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Customer</text>
    <text x="240" y="133" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">Who buys?</text>
  </g>
  <g id="value">
    <rect x="40" y="189" width="400" height="78" rx="10" fill="#315B62"/>
    <text x="240" y="224" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Value</text>
    <text x="240" y="247" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">Why buy?</text>
  </g>
  <g id="delivery">
    <rect x="40" y="303" width="400" height="78" rx="10" fill="#315B62"/>
    <text x="240" y="338" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Delivery</text>
    <text x="240" y="361" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">Where do they buy?</text>
  </g>
  <g id="cost-competition">
    <rect x="40" y="417" width="400" height="78" rx="10" fill="#315B62"/>
    <text x="240" y="452" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Cost · competition</text>
    <text x="240" y="475" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">What does it take and compare with?</text>
  </g>
  <g id="price">
    <rect x="40" y="531" width="400" height="100" rx="10" fill="#C49A5A"/>
    <text x="240" y="577" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">PRICE</text>
    <text x="240" y="600" text-anchor="middle" font-size="17" font-weight="400" fill="#252A30">Outcome of fit · positioning signal</text>
  </g>
  <g id="flow">
    <line x1="240" y1="155" x2="240" y2="186" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <line x1="240" y1="269" x2="240" y2="300" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <line x1="240" y1="383" x2="240" y2="414" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <line x1="240" y1="497" x2="240" y2="528" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
  </g>
  <g id="caption">
    <text x="240" y="675" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">Price reinforces market perception</text>
  </g>
</svg>
