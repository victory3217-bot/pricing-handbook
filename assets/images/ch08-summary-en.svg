<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 768" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">CH08 Summary: From Qualitative to Quantitative — Effective Market Sizing and P×Qty</title>
  <desc id="d">A business model becomes an actionable market number, P×Qty, only after its assumptions pass a QCD reality check. 1. Qualitative: The business model and its assumptions. 2. QCD check: Quality, cost, delivery tested in reality. 3. P × Qty: Turn the market into price times quantity. 4. By deal type: B2C, B2B, B2G need different Qty evidence. Check question: Can I explain the basis of Qty?</desc>
