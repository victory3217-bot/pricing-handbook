<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 750" role="img" aria-labelledby="t d"><title id="t">Three pricing modes</title><desc id="d">Each mode solves a different unknown in the same contribution-margin structure.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#475569"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#0f172a}.h{font-size:21px;font-weight:700}.s{font-size:16px;fill:#475569}.a{fill:#eef2ff;stroke:#6366f1;stroke-width:2}.b{fill:#ecfdf5;stroke:#059669;stroke-width:2}.c{fill:#fef3c7;stroke:#d97706;stroke-width:2}.l{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#a)}</style><rect width="440" height="750" rx="16" fill="#fff"/><text class="h" x="220" y="38" text-anchor="middle">Same structure, different unknown</text><g text-anchor="middle"><rect class="a" x="30" y="80" width="380" height="150" rx="14"/><text class="h" x="220" y="116">MODE A · Diagnose price</text><text class="s" x="220" y="152">Price + cost</text><path class="l" d="M220 168v30"/><text class="h" x="220" y="218">Contribution margin</text><rect class="b" x="30" y="275" width="380" height="150" rx="14"/><text class="h" x="220" y="311">MODE B · Solve target price</text><text class="s" x="220" y="347">Cost + target margin</text><path class="l" d="M220 363v30"/><text class="h" x="220" y="413">Required price</text><rect class="c" x="30" y="470" width="380" height="150" rx="14"/><text class="h" x="220" y="506">MODE C · Solve allowable cost</text><text class="s" x="220" y="542">Market price + target margin</text><path class="l" d="M220 558v30"/><text class="h" x="220" y="608">Allowable cost</text></g><text class="s" x="220" y="680" text-anchor="middle">Which of price, cost, and margin must be solved?</text></svg>
