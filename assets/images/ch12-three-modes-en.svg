<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 697" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">Three pricing modes</title>
  <desc id="d">Each mode solves a different unknown in the same contribution-margin structure.</desc>
  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#14253D"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C49A5A"/>
    </marker>
  </defs>
  <g id="background">
    <rect width="480" height="697" rx="14" fill="#F6F2EA"/>
  </g>
  <g id="headline">
    <text x="240" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">Same structure, different unknown</text>
  </g>
  <g id="mode-a">
    <rect x="40" y="75" width="400" height="146" rx="10" fill="#14253D"/>
    <text x="240" y="110" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">MODE A · Diagnose price</text>
    <text x="240" y="133" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">Price + cost</text>
    <line x1="240" y1="151" x2="240" y2="173" stroke="#C49A5A" stroke-width="2.5" marker-end="url(#arrow-gold)"/>
    <rect x="130" y="175" width="220" height="34" rx="10" fill="#C49A5A"/>
    <text x="240" y="199" text-anchor="middle" font-size="18" font-weight="700" fill="#252A30">Contribution margin</text>
  </g>
  <g id="mode-b">
    <rect x="40" y="257" width="400" height="146" rx="10" fill="#14253D"/>
    <text x="240" y="292" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">MODE B · Solve target price</text>
    <text x="240" y="315" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">Cost + target margin</text>
    <line x1="240" y1="333" x2="240" y2="355" stroke="#C49A5A" stroke-width="2.5" marker-end="url(#arrow-gold)"/>
    <rect x="130" y="357" width="220" height="34" rx="10" fill="#C49A5A"/>
    <text x="240" y="381" text-anchor="middle" font-size="18" font-weight="700" fill="#252A30">Required price</text>
  </g>
  <g id="mode-c">
    <rect x="40" y="439" width="400" height="146" rx="10" fill="#14253D"/>
    <text x="240" y="474" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">MODE C · Solve allowable cost</text>
    <text x="240" y="497" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">Market price + target margin</text>
    <line x1="240" y1="515" x2="240" y2="537" stroke="#C49A5A" stroke-width="2.5" marker-end="url(#arrow-gold)"/>
    <rect x="130" y="539" width="220" height="34" rx="10" fill="#C49A5A"/>
    <text x="240" y="563" text-anchor="middle" font-size="18" font-weight="700" fill="#252A30">Allowable cost</text>
  </g>
  <g id="caption">
    <text x="240" y="629" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">Which of price, cost, and</text>
    <text x="240" y="656" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">margin must be solved?</text>
  </g>
</svg>
