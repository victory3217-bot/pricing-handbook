<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 723" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">CH12 Summary: MODE C — Allowable Cost Reverse Calculation</title>
  <desc id="d">When the market price is fixed, reverse-calculate the maximum allowable cost and check its gap from actual cost. 1. Market price: A selling price already fixed. 2. Target margin: The contribution margin rate to protect. 3. Allowable cost: Maximum direct cost that keeps that margin. 4. Gap: Allowable cost vs. actual cost. Check question: Does actual cost fit inside allowable cost?</desc>
  <g id="background">
    <rect width="480" height="723" rx="14" fill="#F6F2EA"/>
  </g>
  <g id="summary">
    <rect x="24" y="24" width="432" height="104" rx="10" fill="#14253D"/>
    <text x="38" y="50" text-anchor="start" font-size="14" font-weight="700" fill="#C49A5A">CH12</text>
    <text x="38" y="74" text-anchor="start" font-size="20" font-weight="700" fill="#FFFFFF">MODE C — Allowable</text>
    <text x="38" y="101" text-anchor="start" font-size="20" font-weight="700" fill="#FFFFFF">Cost Reverse Calculation</text>
    <rect x="24" y="142" width="432" height="120" rx="10" fill="#315B62"/>
    <text x="38" y="164" text-anchor="start" font-size="13" font-weight="700" fill="#C49A5A">Key message</text>
    <text x="38" y="186" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">When the market price is fixed,</text>
    <text x="38" y="210" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">reverse-calculate the maximum allowable</text>
    <text x="38" y="234" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">cost and check its gap from actual cost.</text>
    <rect x="24" y="276" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="309.5" r="15" fill="#C49A5A"/>
    <text x="52" y="315.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">1</text>
    <text x="80" y="302" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Market price</text>
    <text x="80" y="322" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">A selling price already fixed</text>
    <rect x="24" y="353" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="386.5" r="15" fill="#C49A5A"/>
    <text x="52" y="392.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">2</text>
    <text x="80" y="379" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Target margin</text>
    <text x="80" y="399" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">The contribution margin rate to protect</text>
    <rect x="24" y="430" width="432" height="88" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="474" r="15" fill="#C49A5A"/>
    <text x="52" y="480" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">3</text>
    <text x="80" y="456" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Allowable cost</text>
    <text x="80" y="476" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">Maximum direct cost</text>
    <text x="80" y="497" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">that keeps that margin</text>
    <rect x="24" y="528" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="561.5" r="15" fill="#C49A5A"/>
    <text x="52" y="567.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">4</text>
    <text x="80" y="554" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Gap</text>
    <text x="80" y="574" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">Allowable cost vs. actual cost</text>
    <rect x="24" y="609" width="432" height="90" rx="10" fill="#C49A5A"/>
    <text x="38" y="631" text-anchor="start" font-size="13" font-weight="700" fill="#252A30">Check question</text>
    <text x="38" y="649" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Does actual cost fit</text>
    <text x="38" y="673" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">inside allowable cost?</text>
  </g>
</svg>
