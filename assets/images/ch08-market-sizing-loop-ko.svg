<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 760" role="img" aria-labelledby="t d"><title id="t">유효시장 추정의 반복 구조</title><desc id="d">가설, QCD 검토, 실행모델, 시장 추정을 거쳐 다시 가설을 조정한다.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#475569"/></marker></defs><style>text{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;fill:#0f172a}.h{font-size:21px;font-weight:700}.s{font-size:16px;fill:#475569}.b{fill:#eef2ff;stroke:#6366f1;stroke-width:2}.q{fill:#ecfdf5;stroke:#059669;stroke-width:2}.o{fill:#fef3c7;stroke:#d97706;stroke-width:3}.a{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#a)}.r{stroke:#dc2626;stroke-width:2.5;fill:none;stroke-dasharray:7 5;marker-end:url(#a)}</style><rect width="440" height="760" rx="16" fill="#fff"/><text class="h" x="220" y="38" text-anchor="middle">정성적 가설을 실행 가능한 숫자로</text><g text-anchor="middle"><rect class="b" x="30" y="75" width="380" height="92" rx="12"/><text class="h" x="220" y="110">1–3. 가설 수립</text><text class="s" x="220" y="140">세분화 · 타겟 · 포지셔닝</text><rect class="q" x="30" y="210" width="380" height="92" rx="12"/><text class="h" x="220" y="245">4–5. QCD 현실 검토</text><text class="s" x="220" y="275">자원 · 비용 조건</text><rect class="b" x="30" y="345" width="380" height="92" rx="12"/><text class="h" x="220" y="380">6–8. 실행모델 확정</text><text class="s" x="220" y="410">최종 타겟 · 4P · BMC</text><rect class="o" x="30" y="480" width="380" height="105" rx="14"/><text class="h" x="220" y="518">9. 유효시장</text><text class="h" x="220" y="554">P × Qty</text></g><path class="a" d="M220 167v43"/><path class="a" d="M220 302v43"/><path class="a" d="M220 437v43"/><path class="r" d="M220 585v75H18V120h12"/><text class="s" x="220" y="710" text-anchor="middle">목표·자원과 맞지 않으면 가설과 모델을 조정</text></svg>
