<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 930" role="img" aria-labelledby="t d"><title id="t">시나리오 비교 파이프라인</title><desc id="d">기준선과 변경사항을 병합·검증하고 네 엔진을 실행해 차이를 계산한다.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#475569"/></marker></defs><style>text{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;fill:#0f172a}.h{font-size:20px;font-weight:700}.s{font-size:16px;fill:#475569}.b{fill:#eef2ff;stroke:#6366f1;stroke-width:2}.e{fill:#ecfdf5;stroke:#059669;stroke-width:2}.o{fill:#fef3c7;stroke:#d97706;stroke-width:3}.l{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#a)}</style><rect width="440" height="930" rx="16" fill="#fff"/><text class="h" x="220" y="36" text-anchor="middle">Baseline은 고정하고 달라진 가정만 비교</text><g text-anchor="middle"><rect class="b" x="30" y="70" width="380" height="82" rx="12"/><text class="h" x="220" y="103">1. 요청 수준 사전점검</text><text class="s" x="220" y="132">중복 · 대상 · 기준선 확인</text><rect class="b" x="30" y="185" width="380" height="82" rx="12"/><text class="h" x="220" y="218">2. base + override 병합</text><text class="s" x="220" y="247">달라진 필드만 치환</text><rect class="b" x="30" y="300" width="380" height="82" rx="12"/><text class="h" x="220" y="333">3. 시나리오별 스키마 검증</text><text class="s" x="220" y="362">오류는 해당 시나리오에 한정</text><rect class="e" x="30" y="415" width="380" height="105" rx="12"/><text class="h" x="220" y="448">4. 네 엔진 실행</text><text class="s" x="220" y="478">MODE A · MODE B · MODE C · BEP</text><text class="s" x="220" y="502">각 시나리오에 모두 실행</text><rect class="b" x="30" y="555" width="380" height="82" rx="12"/><text class="h" x="220" y="588">5. 결과 요약</text><text class="s" x="220" y="617">기존 모듈 결과의 읽기 전용 뷰</text><rect class="o" x="30" y="670" width="380" height="100" rx="14"/><text class="h" x="220" y="707">6. Baseline 대비 Δ</text><text class="s" x="220" y="739">순매출 · 공헌이익 · 공헌이익률 · BEP</text></g><path class="l" d="M220 152v33M220 267v33M220 382v33M220 520v35M220 637v33"/><text class="h" x="220" y="835" text-anchor="middle" fill="#b45309">숫자를 비교하되 “최선”은 추천하지 않는다</text></svg>
