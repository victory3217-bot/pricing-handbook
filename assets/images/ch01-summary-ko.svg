<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 651" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">CH01 요약: 가격은 비즈니스모델의 결과다</title>
  <desc id="d">가격은 마지막에 붙이는 숫자가 아니라, 고객·가치·전달방식·비용이 맞물린 비즈니스모델의 결과다. 1. 고객: 누구에게 파는가. 2. 가치: 고객이 왜 돈을 내는가. 3. 전달방식: 어떤 채널·방식으로 전달하는가. 4. 비용: 그 전달에 얼마가 드는가. 체크 질문: 이 가격은 위 네 가지와 서로 맞는가?</desc>
  <g id="background">
    <rect width="480" height="651" rx="14" fill="#F6F2EA"/>
  </g>
  <g id="summary">
    <rect x="24" y="24" width="432" height="77" rx="10" fill="#14253D"/>
    <text x="38" y="50" text-anchor="start" font-size="14" font-weight="700" fill="#C49A5A">CH01</text>
    <text x="38" y="74" text-anchor="start" font-size="20" font-weight="700" fill="#FFFFFF">가격은 비즈니스모델의 결과다</text>
    <rect x="24" y="115" width="432" height="120" rx="10" fill="#315B62"/>
    <text x="38" y="137" text-anchor="start" font-size="13" font-weight="700" fill="#C49A5A">핵심 메시지</text>
    <text x="38" y="159" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">가격은 마지막에 붙이는 숫자가 아</text>
    <text x="38" y="183" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">니라, 고객·가치·전달방식·비용</text>
    <text x="38" y="207" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">이 맞물린 비즈니스모델의 결과다.</text>
    <rect x="24" y="249" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="282.5" r="15" fill="#C49A5A"/>
    <text x="52" y="288.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">1</text>
    <text x="80" y="275" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">고객</text>
    <text x="80" y="295" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">누구에게 파는가</text>
    <rect x="24" y="326" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="359.5" r="15" fill="#C49A5A"/>
    <text x="52" y="365.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">2</text>
    <text x="80" y="352" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">가치</text>
    <text x="80" y="372" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">고객이 왜 돈을 내는가</text>
    <rect x="24" y="403" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="436.5" r="15" fill="#C49A5A"/>
    <text x="52" y="442.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">3</text>
    <text x="80" y="429" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">전달방식</text>
    <text x="80" y="449" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">어떤 채널·방식으로 전달하는가</text>
    <rect x="24" y="480" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="513.5" r="15" fill="#C49A5A"/>
    <text x="52" y="519.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">4</text>
    <text x="80" y="506" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">비용</text>
    <text x="80" y="526" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">그 전달에 얼마가 드는가</text>
    <rect x="24" y="561" width="432" height="66" rx="10" fill="#C49A5A"/>
    <text x="38" y="583" text-anchor="start" font-size="13" font-weight="700" fill="#252A30">체크 질문</text>
    <text x="38" y="601" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">이 가격은 위 네 가지와 서로 맞는가?</text>
  </g>
</svg>
