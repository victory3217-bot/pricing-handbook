<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 627" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">CH02 요약: 원가와 비용구조</title>
  <desc id="d">원가는 회계표에서 시작하는 숫자가 아니라, 고객가치를 만들고 전달하는 실제 활동에서 도출된다. 1. 활동: 가치를 만들고 전달하는 일. 2. 비용: 활동에 드는 돈을 항목별로 모은다. 3. 분류: 직접·간접, 변동·고정으로 나눈다. 4. 원가: 제품 하나가 실제로 부담하는 비용. 체크 질문: 원가표가 실제 활동과 연결되어 있는가?</desc>
  <g id="background">
    <rect width="480" height="627" rx="14" fill="#F6F2EA"/>
  </g>
  <g id="summary">
    <rect x="24" y="24" width="432" height="77" rx="10" fill="#14253D"/>
    <text x="38" y="50" text-anchor="start" font-size="14" font-weight="700" fill="#C49A5A">CH02</text>
    <text x="38" y="74" text-anchor="start" font-size="20" font-weight="700" fill="#FFFFFF">원가와 비용구조</text>
    <rect x="24" y="115" width="432" height="96" rx="10" fill="#315B62"/>
    <text x="38" y="137" text-anchor="start" font-size="13" font-weight="700" fill="#C49A5A">핵심 메시지</text>
    <text x="38" y="159" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">원가는 회계표에서 시작하는 숫자가 아니라, 고객</text>
    <text x="38" y="183" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">가치를 만들고 전달하는 실제 활동에서 도출된다.</text>
    <rect x="24" y="225" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="258.5" r="15" fill="#C49A5A"/>
    <text x="52" y="264.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">1</text>
    <text x="80" y="251" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">활동</text>
    <text x="80" y="271" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">가치를 만들고 전달하는 일</text>
    <rect x="24" y="302" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="335.5" r="15" fill="#C49A5A"/>
    <text x="52" y="341.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">2</text>
    <text x="80" y="328" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">비용</text>
    <text x="80" y="348" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">활동에 드는 돈을 항목별로 모은다</text>
    <rect x="24" y="379" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="412.5" r="15" fill="#C49A5A"/>
    <text x="52" y="418.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">3</text>
    <text x="80" y="405" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">분류</text>
    <text x="80" y="425" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">직접·간접, 변동·고정으로 나눈다</text>
    <rect x="24" y="456" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="489.5" r="15" fill="#C49A5A"/>
    <text x="52" y="495.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">4</text>
    <text x="80" y="482" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">원가</text>
    <text x="80" y="502" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">제품 하나가 실제로 부담하는 비용</text>
    <rect x="24" y="537" width="432" height="66" rx="10" fill="#C49A5A"/>
    <text x="38" y="559" text-anchor="start" font-size="13" font-weight="700" fill="#252A30">체크 질문</text>
    <text x="38" y="577" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">원가표가 실제 활동과 연결되어 있는가?</text>
  </g>
</svg>
