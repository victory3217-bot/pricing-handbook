<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 651" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">CH15 요약: 가격가설의 검증과 의사결정</title>
  <desc id="d">가격은 한 번 계산해 확정하는 숫자가 아니라, 시장 데이터로 계속 검증하고 수정하는 살아 있는 가설이다. 1. 가설: 가격에 대한 가설을 문장으로 쓴다. 2. 검증대상 · 지표: 무엇을 어떤 지표로 볼지 정한다. 3. 방법 · 계획: 어떻게 확인할지 계획한다. 4. 피드백: 데이터로 유지·수정·피보팅을 결정. 체크 질문: 계산 결과와 가정을 구분해 적었는가?</desc>
  <g id="background">
    <rect width="480" height="651" rx="14" fill="#F6F2EA"/>
  </g>
  <g id="summary">
    <rect x="24" y="24" width="432" height="77" rx="10" fill="#14253D"/>
    <text x="38" y="50" text-anchor="start" font-size="14" font-weight="700" fill="#C49A5A">CH15</text>
    <text x="38" y="74" text-anchor="start" font-size="20" font-weight="700" fill="#FFFFFF">가격가설의 검증과 의사결정</text>
    <rect x="24" y="115" width="432" height="120" rx="10" fill="#315B62"/>
    <text x="38" y="137" text-anchor="start" font-size="13" font-weight="700" fill="#C49A5A">핵심 메시지</text>
    <text x="38" y="159" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">가격은 한 번 계산해 확정하는 숫자</text>
    <text x="38" y="183" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">가 아니라, 시장 데이터로 계속 검증</text>
    <text x="38" y="207" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">하고 수정하는 살아 있는 가설이다.</text>
    <rect x="24" y="249" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="282.5" r="15" fill="#C49A5A"/>
    <text x="52" y="288.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">1</text>
    <text x="80" y="275" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">가설</text>
    <text x="80" y="295" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">가격에 대한 가설을 문장으로 쓴다</text>
    <rect x="24" y="326" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="359.5" r="15" fill="#C49A5A"/>
    <text x="52" y="365.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">2</text>
    <text x="80" y="352" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">검증대상 · 지표</text>
    <text x="80" y="372" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">무엇을 어떤 지표로 볼지 정한다</text>
    <rect x="24" y="403" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="436.5" r="15" fill="#C49A5A"/>
    <text x="52" y="442.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">3</text>
    <text x="80" y="429" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">방법 · 계획</text>
    <text x="80" y="449" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">어떻게 확인할지 계획한다</text>
    <rect x="24" y="480" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="513.5" r="15" fill="#C49A5A"/>
    <text x="52" y="519.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">4</text>
    <text x="80" y="506" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">피드백</text>
    <text x="80" y="526" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">데이터로 유지·수정·피보팅을 결정</text>
    <rect x="24" y="561" width="432" height="66" rx="10" fill="#C49A5A"/>
    <text x="38" y="583" text-anchor="start" font-size="13" font-weight="700" fill="#252A30">체크 질문</text>
    <text x="38" y="601" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">계산 결과와 가정을 구분해 적었는가?</text>
  </g>
</svg>
