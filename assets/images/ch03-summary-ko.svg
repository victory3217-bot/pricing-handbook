<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 648" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">CH03 요약: 가격결정의 두 논리</title>
  <desc id="d">좋은 가격은 고객이 인정하는 가치와 경쟁 속에서 선택할 포지션을 함께 반영한다. 1. 고객가치 기반: 지불의사를 먼저 확인하고 사업성을 역으로 설계. 2. 경쟁 기반: 진짜 경쟁자를 정의하고 가격 위치를 비교. 3. 포지셔닝: 가격은 품질·브랜드 위치를 알리는 신호. 4. 정직한 한계: 가격 상·하한을 정하는 표준 절차는 없다. 체크 질문: 내 가격은 의도한 포지션과 일치하는가?</desc>
  <g id="background">
    <rect width="480" height="648" rx="14" fill="#F6F2EA"/>
  </g>
  <g id="summary">
    <rect x="24" y="24" width="432" height="77" rx="10" fill="#14253D"/>
    <text x="38" y="50" text-anchor="start" font-size="14" font-weight="700" fill="#C49A5A">CH03</text>
    <text x="38" y="74" text-anchor="start" font-size="20" font-weight="700" fill="#FFFFFF">가격결정의 두 논리</text>
    <rect x="24" y="115" width="432" height="96" rx="10" fill="#315B62"/>
    <text x="38" y="137" text-anchor="start" font-size="13" font-weight="700" fill="#C49A5A">핵심 메시지</text>
    <text x="38" y="159" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">좋은 가격은 고객이 인정하는 가치와 경쟁</text>
    <text x="38" y="183" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">속에서 선택할 포지션을 함께 반영한다.</text>
    <rect x="24" y="225" width="432" height="88" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="269" r="15" fill="#C49A5A"/>
    <text x="52" y="275" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">1</text>
    <text x="80" y="251" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">고객가치 기반</text>
    <text x="80" y="271" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">지불의사를 먼저 확인하고</text>
    <text x="80" y="292" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">사업성을 역으로 설계</text>
    <rect x="24" y="323" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="356.5" r="15" fill="#C49A5A"/>
    <text x="52" y="362.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">2</text>
    <text x="80" y="349" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">경쟁 기반</text>
    <text x="80" y="369" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">진짜 경쟁자를 정의하고 가격 위치를 비교</text>
    <rect x="24" y="400" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="433.5" r="15" fill="#C49A5A"/>
    <text x="52" y="439.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">3</text>
    <text x="80" y="426" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">포지셔닝</text>
    <text x="80" y="446" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">가격은 품질·브랜드 위치를 알리는 신호</text>
    <rect x="24" y="477" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="510.5" r="15" fill="#C49A5A"/>
    <text x="52" y="516.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">4</text>
    <text x="80" y="503" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">정직한 한계</text>
    <text x="80" y="523" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">가격 상·하한을 정하는 표준 절차는 없다</text>
    <rect x="24" y="558" width="432" height="66" rx="10" fill="#C49A5A"/>
    <text x="38" y="580" text-anchor="start" font-size="13" font-weight="700" fill="#252A30">체크 질문</text>
    <text x="38" y="598" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">내 가격은 의도한 포지션과 일치하는가?</text>
  </g>
</svg>
