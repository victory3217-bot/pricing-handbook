<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 784" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">What reshapes price structure</title>
  <desc id="d">Target customer, channel, Customer Relationship Cost, and cost with target margin come together in the price structure, which is checked for whether the target margin still holds.</desc>
  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#14253D"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C49A5A"/>
    </marker>
  </defs>
  <g id="background">
    <rect width="480" height="784" rx="14" fill="#F6F2EA"/>
  </g>
  <g id="headline">
    <text x="240" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">What reshapes price structure</text>
  </g>
  <g id="target-customer">
    <rect x="40" y="75" width="400" height="101" rx="10" fill="#315B62"/>
    <text x="240" y="110" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Target customer</text>
    <text x="240" y="133" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">A given price assumes</text>
    <text x="240" y="156" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">a particular customer</text>
  </g>
  <g id="channel">
    <rect x="40" y="220" width="400" height="101" rx="10" fill="#315B62"/>
    <text x="240" y="255" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Channel (direct vs. indirect)</text>
    <text x="240" y="278" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">Fees · distribution margin ·</text>
    <text x="240" y="301" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">operating burden</text>
  </g>
  <g id="relationship-cost">
    <rect x="40" y="365" width="400" height="78" rx="10" fill="#315B62"/>
    <text x="240" y="400" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Customer Relationship Cost</text>
    <text x="240" y="423" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">Acquisition · retention · repurchase</text>
  </g>
  <g id="cost-margin">
    <rect x="40" y="487" width="400" height="78" rx="10" fill="#315B62"/>
    <text x="240" y="522" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Cost and target margin</text>
    <text x="240" y="545" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">The base elements of price structure</text>
  </g>
  <g id="price-structure">
    <rect x="40" y="609" width="400" height="147" rx="10" fill="#C49A5A"/>
    <text x="240" y="644" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">Price structure</text>
    <text x="240" y="667" text-anchor="middle" font-size="17" font-weight="400" fill="#252A30">Does the target margin still</text>
    <text x="240" y="690" text-anchor="middle" font-size="17" font-weight="400" fill="#252A30">hold after all of it?</text>
    <text x="240" y="713" text-anchor="middle" font-size="17" font-weight="400" fill="#252A30">If not: adjust channel, price,</text>
    <text x="240" y="736" text-anchor="middle" font-size="17" font-weight="400" fill="#252A30">or relationship</text>
  </g>
  <g id="flow">
    <text x="240" y="208" text-anchor="middle" font-size="30" font-weight="700" fill="#252A30">+</text>
    <text x="240" y="353" text-anchor="middle" font-size="30" font-weight="700" fill="#252A30">+</text>
    <text x="240" y="475" text-anchor="middle" font-size="30" font-weight="700" fill="#252A30">+</text>
    <line x1="240" y1="567" x2="240" y2="606" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
  </g>
</svg>
