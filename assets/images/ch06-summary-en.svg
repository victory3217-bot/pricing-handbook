<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 726" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">CH06 Summary: The Three Financial Lenses and the Bridge to Business Feasibility</title>
  <desc id="d">Feasibility can be tested only after price P, the cost-and-margin structure, and the revenue model are defined. 1. Profit lens: Revenue minus costs. 2. Asset lens: Does the business raise asset value?. 3. Cash-flow lens: When does cash actually move?. 4. Three inputs: Price P, cost-and-margin structure, revenue model. Check question: Are the three inputs defined?</desc>
  <g id="background">
    <rect width="480" height="726" rx="14" fill="#F6F2EA"/>
  </g>
  <g id="summary">
    <rect x="24" y="24" width="432" height="131" rx="10" fill="#14253D"/>
    <text x="38" y="50" text-anchor="start" font-size="14" font-weight="700" fill="#C49A5A">CH06</text>
    <text x="38" y="74" text-anchor="start" font-size="20" font-weight="700" fill="#FFFFFF">The Three Financial</text>
    <text x="38" y="101" text-anchor="start" font-size="20" font-weight="700" fill="#FFFFFF">Lenses and the Bridge</text>
    <text x="38" y="128" text-anchor="start" font-size="20" font-weight="700" fill="#FFFFFF">to Business Feasibility</text>
    <rect x="24" y="169" width="432" height="120" rx="10" fill="#315B62"/>
    <text x="38" y="191" text-anchor="start" font-size="13" font-weight="700" fill="#C49A5A">Key message</text>
    <text x="38" y="213" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">Feasibility can be tested only after</text>
    <text x="38" y="237" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">price P, the cost-and-margin structure,</text>
    <text x="38" y="261" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">and the revenue model are defined.</text>
    <rect x="24" y="303" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="336.5" r="15" fill="#C49A5A"/>
    <text x="52" y="342.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">1</text>
    <text x="80" y="329" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Profit lens</text>
    <text x="80" y="349" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">Revenue minus costs</text>
    <rect x="24" y="380" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="413.5" r="15" fill="#C49A5A"/>
    <text x="52" y="419.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">2</text>
    <text x="80" y="406" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Asset lens</text>
    <text x="80" y="426" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">Does the business raise asset value?</text>
    <rect x="24" y="457" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="490.5" r="15" fill="#C49A5A"/>
    <text x="52" y="496.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">3</text>
    <text x="80" y="483" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Cash-flow lens</text>
    <text x="80" y="503" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">When does cash actually move?</text>
    <rect x="24" y="534" width="432" height="88" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="578" r="15" fill="#C49A5A"/>
    <text x="52" y="584" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">4</text>
    <text x="80" y="560" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Three inputs</text>
    <text x="80" y="580" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">Price P, cost-and-margin</text>
    <text x="80" y="601" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">structure, revenue model</text>
    <rect x="24" y="636" width="432" height="66" rx="10" fill="#C49A5A"/>
    <text x="38" y="658" text-anchor="start" font-size="13" font-weight="700" fill="#252A30">Check question</text>
    <text x="38" y="676" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Are the three inputs defined?</text>
  </g>
</svg>
