<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 627" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">CH08 요약: 정성에서 정량으로 — P×Qty</title>
  <desc id="d">비즈니스모델은 QCD의 현실 검증을 거쳐야 비로소 P×Qty라는 실행 가능한 시장 숫자로 바뀐다. 1. 정성: 비즈니스모델과 가정. 2. QCD 검증: 품질·비용·납기를 현실에서 확인. 3. P × Qty: 가격과 판매수량으로 시장을 숫자로. 4. 거래유형별: B2C·B2B·B2G는 Qty의 근거가 다르다. 체크 질문: Qty의 근거를 설명할 수 있는가?</desc>
  <g id="background">
    <rect width="480" height="627" rx="14" fill="#F6F2EA"/>
  </g>
  <g id="summary">
    <rect x="24" y="24" width="432" height="77" rx="10" fill="#14253D"/>
    <text x="38" y="50" text-anchor="start" font-size="14" font-weight="700" fill="#C49A5A">CH08</text>
    <text x="38" y="74" text-anchor="start" font-size="20" font-weight="700" fill="#FFFFFF">정성에서 정량으로 — P×Qty</text>
    <rect x="24" y="115" width="432" height="96" rx="10" fill="#315B62"/>
    <text x="38" y="137" text-anchor="start" font-size="13" font-weight="700" fill="#C49A5A">핵심 메시지</text>
    <text x="38" y="159" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">비즈니스모델은 QCD의 현실 검증을 거쳐야 비로</text>
    <text x="38" y="183" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">소 P×Qty라는 실행 가능한 시장 숫자로 바뀐다.</text>
    <rect x="24" y="225" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="258.5" r="15" fill="#C49A5A"/>
    <text x="52" y="264.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">1</text>
    <text x="80" y="251" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">정성</text>
    <text x="80" y="271" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">비즈니스모델과 가정</text>
    <rect x="24" y="302" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="335.5" r="15" fill="#C49A5A"/>
    <text x="52" y="341.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">2</text>
    <text x="80" y="328" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">QCD 검증</text>
    <text x="80" y="348" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">품질·비용·납기를 현실에서 확인</text>
    <rect x="24" y="379" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="412.5" r="15" fill="#C49A5A"/>
    <text x="52" y="418.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">3</text>
    <text x="80" y="405" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">P × Qty</text>
    <text x="80" y="425" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">가격과 판매수량으로 시장을 숫자로</text>
    <rect x="24" y="456" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="489.5" r="15" fill="#C49A5A"/>
    <text x="52" y="495.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">4</text>
    <text x="80" y="482" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">거래유형별</text>
    <text x="80" y="502" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">B2C·B2B·B2G는 Qty의 근거가 다르다</text>
    <rect x="24" y="537" width="432" height="66" rx="10" fill="#C49A5A"/>
    <text x="38" y="559" text-anchor="start" font-size="13" font-weight="700" fill="#252A30">체크 질문</text>
    <text x="38" y="577" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Qty의 근거를 설명할 수 있는가?</text>
  </g>
</svg>
