<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 651" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">CH07 요약: 유효시장과 나의 시장</title>
  <desc id="d">유효시장은 전체 시장의 일부가 아니라, 가격과 사업모델의 제약을 통과한 뒤 실제로 도달할 수 있는 시장이다. 1. 전체시장: 이론상 존재하는 시장. 2. 구매자 기준: 실제로 돈을 내는 구매자로 다시 정의. 3. 제약 통과: 가격과 사업모델의 제약을 적용. 4. 유효시장 → 나의 시장: 내가 도달 가능한 몫. 체크 질문: 근거 없는 시장 숫자가 섞여 있지 않은가?</desc>
  <g id="background">
    <rect width="480" height="651" rx="14" fill="#F6F2EA"/>
  </g>
  <g id="summary">
    <rect x="24" y="24" width="432" height="77" rx="10" fill="#14253D"/>
    <text x="38" y="50" text-anchor="start" font-size="14" font-weight="700" fill="#C49A5A">CH07</text>
    <text x="38" y="74" text-anchor="start" font-size="20" font-weight="700" fill="#FFFFFF">유효시장과 나의 시장</text>
    <rect x="24" y="115" width="432" height="120" rx="10" fill="#315B62"/>
    <text x="38" y="137" text-anchor="start" font-size="13" font-weight="700" fill="#C49A5A">핵심 메시지</text>
    <text x="38" y="159" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">유효시장은 전체 시장의 일부가 아니</text>
    <text x="38" y="183" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">라, 가격과 사업모델의 제약을 통과한</text>
    <text x="38" y="207" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">뒤 실제로 도달할 수 있는 시장이다.</text>
    <rect x="24" y="249" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="282.5" r="15" fill="#C49A5A"/>
    <text x="52" y="288.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">1</text>
    <text x="80" y="275" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">전체시장</text>
    <text x="80" y="295" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">이론상 존재하는 시장</text>
    <rect x="24" y="326" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="359.5" r="15" fill="#C49A5A"/>
    <text x="52" y="365.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">2</text>
    <text x="80" y="352" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">구매자 기준</text>
    <text x="80" y="372" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">실제로 돈을 내는 구매자로 다시 정의</text>
    <rect x="24" y="403" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="436.5" r="15" fill="#C49A5A"/>
    <text x="52" y="442.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">3</text>
    <text x="80" y="429" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">제약 통과</text>
    <text x="80" y="449" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">가격과 사업모델의 제약을 적용</text>
    <rect x="24" y="480" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="513.5" r="15" fill="#C49A5A"/>
    <text x="52" y="519.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">4</text>
    <text x="80" y="506" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">유효시장 → 나의 시장</text>
    <text x="80" y="526" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">내가 도달 가능한 몫</text>
    <rect x="24" y="561" width="432" height="66" rx="10" fill="#C49A5A"/>
    <text x="38" y="583" text-anchor="start" font-size="13" font-weight="700" fill="#252A30">체크 질문</text>
    <text x="38" y="601" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">근거 없는 시장 숫자가 섞여 있지 않은가?</text>
  </g>
</svg>
