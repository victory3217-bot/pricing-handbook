<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 651" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">CH11 요약: MODE B — 목표가격 역산</title>
  <desc id="d">목표가격 역산은 원하는 마진을 가격으로 번역하고, 현재 비용구조로 그 목표가 가능한지 드러낸다. 1. 목표: 목표 공헌이익률 t를 정한다. 2. 비용 구분: 고정금액형 · 순매출 기준 · 총지불금액 기준. 3. 역산: 필요한 순매출과 표시가격을 구한다. 4. 해석: 그 가격이 시장에서 가능한지는 별도 판단. 체크 질문: 목표율의 출처를 말할 수 있는가?</desc>
  <g id="background">
    <rect width="480" height="651" rx="14" fill="#F6F2EA"/>
  </g>
  <g id="summary">
    <rect x="24" y="24" width="432" height="77" rx="10" fill="#14253D"/>
    <text x="38" y="50" text-anchor="start" font-size="14" font-weight="700" fill="#C49A5A">CH11</text>
    <text x="38" y="74" text-anchor="start" font-size="20" font-weight="700" fill="#FFFFFF">MODE B — 목표가격 역산</text>
    <rect x="24" y="115" width="432" height="120" rx="10" fill="#315B62"/>
    <text x="38" y="137" text-anchor="start" font-size="13" font-weight="700" fill="#C49A5A">핵심 메시지</text>
    <text x="38" y="159" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">목표가격 역산은 원하는 마진을 가</text>
    <text x="38" y="183" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">격으로 번역하고, 현재 비용구조로</text>
    <text x="38" y="207" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">그 목표가 가능한지 드러낸다.</text>
    <rect x="24" y="249" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="282.5" r="15" fill="#C49A5A"/>
    <text x="52" y="288.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">1</text>
    <text x="80" y="275" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">목표</text>
    <text x="80" y="295" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">목표 공헌이익률 t를 정한다</text>
    <rect x="24" y="326" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="359.5" r="15" fill="#C49A5A"/>
    <text x="52" y="365.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">2</text>
    <text x="80" y="352" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">비용 구분</text>
    <text x="80" y="372" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">고정금액형 · 순매출 기준 · 총지불금액 기준</text>
    <rect x="24" y="403" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="436.5" r="15" fill="#C49A5A"/>
    <text x="52" y="442.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">3</text>
    <text x="80" y="429" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">역산</text>
    <text x="80" y="449" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">필요한 순매출과 표시가격을 구한다</text>
    <rect x="24" y="480" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="513.5" r="15" fill="#C49A5A"/>
    <text x="52" y="519.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">4</text>
    <text x="80" y="506" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">해석</text>
    <text x="80" y="526" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">그 가격이 시장에서 가능한지는 별도 판단</text>
    <rect x="24" y="561" width="432" height="66" rx="10" fill="#C49A5A"/>
    <text x="38" y="583" text-anchor="start" font-size="13" font-weight="700" fill="#252A30">체크 질문</text>
    <text x="38" y="601" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">목표율의 출처를 말할 수 있는가?</text>
  </g>
</svg>
