<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 678" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">CH05 Summary: Revenue Streams and Pricing Mechanisms</title>
  <desc id="d">A revenue model is not a price list; it defines who pays, for what, how much, when, and how repeatedly. 1. Who and for what: The payer and the thing paid for. 2. How much: Price and pricing mechanism. 3. When: The timing of cash coming in. 4. Once or repeatedly: One-time vs. recurring revenue. Check question: Can we answer all five questions?</desc>
  <g id="background">
    <rect width="480" height="678" rx="14" fill="#F6F2EA"/>
  </g>
  <g id="summary">
    <rect x="24" y="24" width="432" height="104" rx="10" fill="#14253D"/>
    <text x="38" y="50" text-anchor="start" font-size="14" font-weight="700" fill="#C49A5A">CH05</text>
    <text x="38" y="74" text-anchor="start" font-size="20" font-weight="700" fill="#FFFFFF">Revenue Streams and</text>
    <text x="38" y="101" text-anchor="start" font-size="20" font-weight="700" fill="#FFFFFF">Pricing Mechanisms</text>
    <rect x="24" y="142" width="432" height="120" rx="10" fill="#315B62"/>
    <text x="38" y="164" text-anchor="start" font-size="13" font-weight="700" fill="#C49A5A">Key message</text>
    <text x="38" y="186" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">A revenue model is not a price list;</text>
    <text x="38" y="210" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">it defines who pays, for what, how</text>
    <text x="38" y="234" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">much, when, and how repeatedly.</text>
    <rect x="24" y="276" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="309.5" r="15" fill="#C49A5A"/>
    <text x="52" y="315.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">1</text>
    <text x="80" y="302" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Who and for what</text>
    <text x="80" y="322" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">The payer and the thing paid for</text>
    <rect x="24" y="353" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="386.5" r="15" fill="#C49A5A"/>
    <text x="52" y="392.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">2</text>
    <text x="80" y="379" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">How much</text>
    <text x="80" y="399" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">Price and pricing mechanism</text>
    <rect x="24" y="430" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="463.5" r="15" fill="#C49A5A"/>
    <text x="52" y="469.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">3</text>
    <text x="80" y="456" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">When</text>
    <text x="80" y="476" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">The timing of cash coming in</text>
    <rect x="24" y="507" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="540.5" r="15" fill="#C49A5A"/>
    <text x="52" y="546.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">4</text>
    <text x="80" y="533" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Once or repeatedly</text>
    <text x="80" y="553" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">One-time vs. recurring revenue</text>
    <rect x="24" y="588" width="432" height="66" rx="10" fill="#C49A5A"/>
    <text x="38" y="610" text-anchor="start" font-size="13" font-weight="700" fill="#252A30">Check question</text>
    <text x="38" y="628" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Can we answer all five questions?</text>
  </g>
</svg>
