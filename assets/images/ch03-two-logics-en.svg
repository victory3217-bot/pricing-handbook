<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 850" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">Two logics of pricing</title>
  <desc id="d">Customer-value-based pricing and competition-based pricing are two parallel flows. The two logics are not mutually exclusive and together shape the pricing strategy. The customer-value flow goes from customer value to reverse economics; the competition flow goes from defining true competitors through comparing their prices to positioning.</desc>
  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#14253D"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C49A5A"/>
    </marker>
  </defs>
  <g id="background">
    <rect width="480" height="850" rx="14" fill="#F6F2EA"/>
  </g>
  <g id="headline">
    <text x="240" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">Price sits where</text>
    <text x="240" y="71" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">value meets competition</text>
  </g>
  <g id="column-headings">
    <text x="128" y="116" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">Customer-value based</text>
    <text x="352" y="116" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">Competition based</text>
  </g>
  <g id="customer-value">
    <rect x="24" y="134" width="208" height="128" rx="10" fill="#14253D"/>
    <text x="128" y="182" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Customer value</text>
    <text x="128" y="206" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">WTP · acceptable</text>
    <text x="128" y="229" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">range</text>
  </g>
  <g id="reverse-economics">
    <rect x="24" y="298" width="208" height="128" rx="10" fill="#14253D"/>
    <text x="128" y="346" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Reverse economics</text>
    <text x="128" y="370" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">Review cost ·</text>
    <text x="128" y="393" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">offering</text>
  </g>
  <g id="true-competitors">
    <rect x="248" y="134" width="208" height="128" rx="10" fill="#315B62"/>
    <text x="352" y="182" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">True competitors</text>
    <text x="352" y="206" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">Same customer ·</text>
    <text x="352" y="229" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">similar value</text>
  </g>
  <g id="competitor-prices">
    <rect x="248" y="298" width="208" height="128" rx="10" fill="#315B62"/>
    <text x="352" y="333" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Compare competitor</text>
    <text x="352" y="360" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">prices</text>
    <text x="352" y="383" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">Don't copy the</text>
    <text x="352" y="406" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">industry average</text>
  </g>
  <g id="positioning">
    <rect x="248" y="462" width="208" height="128" rx="10" fill="#315B62"/>
    <text x="352" y="510" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Positioning</text>
    <text x="352" y="534" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">Price as a market</text>
    <text x="352" y="557" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">signal</text>
  </g>
  <g id="flow">
    <line x1="128" y1="264" x2="128" y2="295" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <line x1="352" y1="264" x2="352" y2="295" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <line x1="352" y1="428" x2="352" y2="459" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <line x1="128" y1="428" x2="128" y2="635" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <line x1="352" y1="592" x2="352" y2="635" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
  </g>
  <g id="pricing-strategy">
    <rect x="40" y="638" width="400" height="100" rx="10" fill="#C49A5A"/>
    <text x="240" y="684" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">PRICING STRATEGY</text>
    <text x="240" y="707" text-anchor="middle" font-size="17" font-weight="400" fill="#252A30">Customer value × market position</text>
  </g>
  <g id="caption">
    <text x="240" y="782" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">The two logics are</text>
    <text x="240" y="809" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">not mutually exclusive</text>
  </g>
</svg>
