<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 720" role="img" aria-labelledby="t d"><title id="t">Two logics of pricing</title><desc id="d">Customer value and competitive positioning meet in pricing strategy.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#475569"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#0f172a}.h{font-size:21px;font-weight:700}.s{font-size:16px;fill:#475569}.v{fill:#ecfdf5;stroke:#059669;stroke-width:2}.c{fill:#eef2ff;stroke:#6366f1;stroke-width:2}.p{fill:#fef3c7;stroke:#d97706;stroke-width:3}.l{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#a)}</style><rect width="440" height="720" rx="16" fill="#fff"/><text class="h" x="220" y="38" text-anchor="middle">Price sits where value meets competition</text><g text-anchor="middle"><rect class="v" x="30" y="75" width="380" height="82" rx="12"/><text class="h" x="220" y="109">Customer value</text><text class="s" x="220" y="137">WTP · acceptable range</text><rect class="v" x="30" y="190" width="380" height="82" rx="12"/><text class="h" x="220" y="224">Reverse economics</text><text class="s" x="220" y="252">Review cost · offering</text><rect class="c" x="30" y="335" width="380" height="82" rx="12"/><text class="h" x="220" y="369">True competitors</text><text class="s" x="220" y="397">Same customer · similar value</text><rect class="c" x="30" y="450" width="380" height="82" rx="12"/><text class="h" x="220" y="484">Positioning</text><text class="s" x="220" y="512">Price as a market signal</text><rect class="p" x="30" y="585" width="380" height="92" rx="14"/><text class="h" x="220" y="625">PRICING STRATEGY</text><text class="s" x="220" y="653">Customer value × market position</text></g><path class="l" d="M220 157v33"/><path class="l" d="M220 272v63"/><path class="l" d="M220 417v33"/><path class="l" d="M220 532v53"/></svg>
