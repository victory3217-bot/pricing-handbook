<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 720" role="img" aria-labelledby="t d"><title id="t">가격은 비즈니스모델의 결과</title><desc id="d">고객, 가치, 전달방식, 비용과 경쟁이 가격으로 모인다.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#475569"/></marker></defs><style>text{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;fill:#0f172a}.h{font-size:21px;font-weight:700}.s{font-size:16px;fill:#475569}.b{fill:#eef2ff;stroke:#6366f1;stroke-width:2}.p{fill:#fef3c7;stroke:#d97706;stroke-width:3}.l{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#a)}</style><rect width="440" height="720" rx="16" fill="#fff"/><text class="h" x="220" y="38" text-anchor="middle">비즈니스모델의 답이 가격으로 모인다</text><g text-anchor="middle"><rect class="b" x="30" y="70" width="380" height="82" rx="12"/><text class="h" x="220" y="104">고객</text><text class="s" x="220" y="132">누가 사는가</text><rect class="b" x="30" y="180" width="380" height="82" rx="12"/><text class="h" x="220" y="214">가치</text><text class="s" x="220" y="242">왜 사는가</text><rect class="b" x="30" y="290" width="380" height="82" rx="12"/><text class="h" x="220" y="324">전달방식</text><text class="s" x="220" y="352">어디에서 사는가</text><rect class="b" x="30" y="400" width="380" height="82" rx="12"/><text class="h" x="220" y="434">비용 · 경쟁</text><text class="s" x="220" y="462">무엇이 들고 누구와 비교되는가</text><rect class="p" x="30" y="545" width="380" height="105" rx="14"/><text class="h" x="220" y="588">가격</text><text class="s" x="220" y="619">정합성의 결과 · 포지셔닝 신호</text></g><path class="l" d="M220 152v28"/><path class="l" d="M220 262v28"/><path class="l" d="M220 372v28"/><path class="l" d="M220 482v63"/><text class="s" x="220" y="690" text-anchor="middle">가격은 다시 시장 인식을 강화한다</text></svg>
