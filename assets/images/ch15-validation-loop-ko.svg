<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 820" role="img" aria-labelledby="t d"><title id="t">가격가설 검증 순환</title><desc id="d">가격가설을 네 요소로 검증하고 피드백으로 사업모델 가정을 수정한다.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#475569"/></marker></defs><style>text{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;fill:#0f172a}.h{font-size:21px;font-weight:700}.s{font-size:16px;fill:#475569}.b{fill:#eef2ff;stroke:#6366f1;stroke-width:2}.e{fill:#ecfdf5;stroke:#059669;stroke-width:2}.o{fill:#fef3c7;stroke:#d97706;stroke-width:3}.l{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#a)}.r{stroke:#dc2626;stroke-width:2.5;fill:none;stroke-dasharray:7 5;marker-end:url(#a)}</style><rect width="440" height="820" rx="16" fill="#fff"/><text class="h" x="220" y="38" text-anchor="middle">가격은 검증하고 수정하는 가설이다</text><g text-anchor="middle"><rect class="o" x="30" y="75" width="380" height="82" rx="14"/><text class="h" x="220" y="124">가격가설</text><rect class="b" x="30" y="200" width="380" height="82" rx="12"/><text class="h" x="220" y="233">1. 조사검증대상</text><text class="s" x="220" y="262">무엇을 확인할 것인가?</text><rect class="b" x="30" y="325" width="380" height="82" rx="12"/><text class="h" x="220" y="358">2. 측정지표</text><text class="s" x="220" y="387">무엇으로 판단할 것인가?</text><rect class="b" x="30" y="450" width="380" height="82" rx="12"/><text class="h" x="220" y="483">3. 방법 및 계획</text><text class="s" x="220" y="512">어떻게 · 언제 · 누구에게?</text><rect class="e" x="30" y="575" width="380" height="82" rx="12"/><text class="h" x="220" y="608">4. 피드백데이터</text><text class="s" x="220" y="637">어느 가정을 수정할 것인가?</text></g><path class="l" d="M220 157v43"/><path class="l" d="M220 282v43"/><path class="l" d="M220 407v43"/><path class="l" d="M220 532v43"/><path class="r" d="M220 657v75H18V116h12"/><text class="s" x="220" y="780" text-anchor="middle">가격 · 고객 · 가치 · 채널 · 원가 가정을 업데이트</text></svg>
