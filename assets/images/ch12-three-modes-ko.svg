<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 697" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">세 가지 가격 계산 모드</title>
  <desc id="d">같은 공헌이익 구조에서 모드마다 다른 미지수를 구한다.</desc>
  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#14253D"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C49A5A"/>
    </marker>
  </defs>
  <g id="background">
    <rect width="480" height="697" rx="14" fill="#F6F2EA"/>
  </g>
  <g id="headline">
    <text x="240" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">같은 구조, 다른 미지수</text>
  </g>
  <g id="mode-a">
    <rect x="40" y="75" width="400" height="146" rx="10" fill="#14253D"/>
    <text x="240" y="110" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">MODE A · 현재가격 진단</text>
    <text x="240" y="133" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">가격 + 원가</text>
    <line x1="240" y1="151" x2="240" y2="173" stroke="#C49A5A" stroke-width="2.5" marker-end="url(#arrow-gold)"/>
    <rect x="130" y="175" width="220" height="34" rx="10" fill="#C49A5A"/>
    <text x="240" y="199" text-anchor="middle" font-size="18" font-weight="700" fill="#252A30">공헌이익</text>
  </g>
  <g id="mode-b">
    <rect x="40" y="257" width="400" height="146" rx="10" fill="#14253D"/>
    <text x="240" y="292" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">MODE B · 목표가격 역산</text>
    <text x="240" y="315" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">원가 + 목표마진</text>
    <line x1="240" y1="333" x2="240" y2="355" stroke="#C49A5A" stroke-width="2.5" marker-end="url(#arrow-gold)"/>
    <rect x="130" y="357" width="220" height="34" rx="10" fill="#C49A5A"/>
    <text x="240" y="381" text-anchor="middle" font-size="18" font-weight="700" fill="#252A30">필요 가격</text>
  </g>
  <g id="mode-c">
    <rect x="40" y="439" width="400" height="146" rx="10" fill="#14253D"/>
    <text x="240" y="474" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">MODE C · 허용원가 역산</text>
    <text x="240" y="497" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">시장가격 + 목표마진</text>
    <line x1="240" y1="515" x2="240" y2="537" stroke="#C49A5A" stroke-width="2.5" marker-end="url(#arrow-gold)"/>
    <rect x="130" y="539" width="220" height="34" rx="10" fill="#C49A5A"/>
    <text x="240" y="563" text-anchor="middle" font-size="18" font-weight="700" fill="#252A30">허용원가</text>
  </g>
  <g id="caption">
    <text x="240" y="629" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">가격·원가·마진 중</text>
    <text x="240" y="656" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">무엇을 구할 것인가?</text>
  </g>
</svg>
