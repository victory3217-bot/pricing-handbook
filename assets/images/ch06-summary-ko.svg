    <rect width="480" height="627" rx="14" fill="#F6F2EA"/>
  </g>
  <g id="summary">
    <rect x="24" y="24" width="432" height="77" rx="10" fill="#14253D"/>
    <text x="38" y="50" text-anchor="start" font-size="14" font-weight="700" fill="#C49A5A">CH06</text>
    <text x="38" y="74" text-anchor="start" font-size="20" font-weight="700" fill="#FFFFFF">세 재무 렌즈와 사업타당성</text>
    <rect x="24" y="115" width="432" height="96" rx="10" fill="#315B62"/>
    <text x="38" y="137" text-anchor="start" font-size="13" font-weight="700" fill="#C49A5A">핵심 메시지</text>
    <text x="38" y="159" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">가격 P, 비용·마진 구조, 수익모델이 정</text>
    <text x="38" y="183" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">리되어야 사업타당성을 검증할 수 있다.</text>
    <rect x="24" y="225" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="258.5" r="15" fill="#C49A5A"/>
    <text x="52" y="264.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">1</text>
    <text x="80" y="251" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">손익 관점</text>
    <text x="80" y="271" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">매출에서 비용을 뺀 이익</text>
    <rect x="24" y="302" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="335.5" r="15" fill="#C49A5A"/>
    <text x="52" y="341.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">2</text>
    <text x="80" y="328" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">자산 관점</text>
    <text x="80" y="348" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">사업으로 보유자산 가치가 오르는가</text>
    <rect x="24" y="379" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="412.5" r="15" fill="#C49A5A"/>
    <text x="52" y="418.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">3</text>
    <text x="80" y="405" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">현금흐름 관점</text>
    <text x="80" y="425" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">현금이 실제로 언제 들어오고 나가는가</text>
    <rect x="24" y="456" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="489.5" r="15" fill="#C49A5A"/>
    <text x="52" y="495.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">4</text>
    <text x="80" y="482" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">세 입력값</text>
    <text x="80" y="502" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">가격 P · 비용·마진 구조 · 수익모델</text>
