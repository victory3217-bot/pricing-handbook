<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 627" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">CH06 요약: 세 재무 렌즈와 사업타당성</title>
  <desc id="d">가격 P, 비용·마진 구조, 수익모델이 정리되어야 사업타당성을 검증할 수 있다. 1. 손익 관점: 매출에서 비용을 뺀 이익. 2. 자산 관점: 사업으로 보유자산 가치가 오르는가. 3. 현금흐름 관점: 현금이 실제로 언제 들어오고 나가는가. 4. 세 입력값: 가격 P · 비용·마진 구조 · 수익모델. 체크 질문: 세 입력값이 정리되었는가?</desc>
