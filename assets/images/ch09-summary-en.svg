    <text x="38" y="210" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">scorecards; they are feedback that</text>
    <text x="38" y="234" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">exposes assumptions requiring redesign.</text>
    <rect x="24" y="276" width="432" height="88" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="320" r="15" fill="#C49A5A"/>
    <text x="52" y="326" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">1</text>
    <text x="80" y="302" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Quality</text>
    <text x="80" y="322" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">Can we make what the</text>
    <text x="80" y="343" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">target customer requires?</text>
    <rect x="24" y="374" width="432" height="88" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="418" r="15" fill="#C49A5A"/>
    <text x="52" y="424" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">2</text>
    <text x="80" y="400" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Delivery</text>
    <text x="80" y="420" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">Can we supply at the</text>
    <text x="80" y="441" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">needed scale and time?</text>
    <rect x="24" y="472" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="505.5" r="15" fill="#C49A5A"/>
    <text x="52" y="511.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">3</text>
