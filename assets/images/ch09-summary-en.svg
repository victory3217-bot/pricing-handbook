<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 744" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">CH09 Summary: Interpreting QCD and Projected P&amp;L, and Iterative Validation</title>
  <desc id="d">QCD and projected P&amp;L are not scorecards; they are feedback that exposes assumptions requiring redesign. 1. Quality: Can we make what the target customer requires?. 2. Delivery: Can we supply at the needed scale and time?. 3. Cost: Can we do it at an affordable cost?. 4. Iterate: Fix failing assumptions and recalculate. Check question: If any one is blocked, did we revise the hypothesis?</desc>
