<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 651" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">CH14 요약: Scenario Compare — 시나리오 비교</title>
  <desc id="d">시나리오 비교는 정답을 추천하지 않고, 같은 기준선에서 가정 하나의 변화가 숫자를 어떻게 바꾸는지 보여준다. 1. 기준선: baseline 시나리오를 하나 정한다. 2. 변형: base에 바꿀 값(override)만 얹는다. 3. 실행: 각 시나리오에 모드를 실행해 요약. 4. 델타: baseline 대비 변화량을 읽는다. 체크 질문: 한 번에 가정 하나만 바꿨는가?</desc>
  <g id="background">
    <rect width="480" height="651" rx="14" fill="#F6F2EA"/>
  </g>
  <g id="summary">
    <rect x="24" y="24" width="432" height="77" rx="10" fill="#14253D"/>
    <text x="38" y="50" text-anchor="start" font-size="14" font-weight="700" fill="#C49A5A">CH14</text>
    <text x="38" y="74" text-anchor="start" font-size="20" font-weight="700" fill="#FFFFFF">Scenario Compare — 시나리오 비교</text>
    <rect x="24" y="115" width="432" height="120" rx="10" fill="#315B62"/>
    <text x="38" y="137" text-anchor="start" font-size="13" font-weight="700" fill="#C49A5A">핵심 메시지</text>
    <text x="38" y="159" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">시나리오 비교는 정답을 추천하지 않고</text>
    <text x="38" y="183" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">, 같은 기준선에서 가정 하나의 변화</text>
    <text x="38" y="207" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">가 숫자를 어떻게 바꾸는지 보여준다.</text>
    <rect x="24" y="249" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="282.5" r="15" fill="#C49A5A"/>
    <text x="52" y="288.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">1</text>
    <text x="80" y="275" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">기준선</text>
    <text x="80" y="295" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">baseline 시나리오를 하나 정한다</text>
    <rect x="24" y="326" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="359.5" r="15" fill="#C49A5A"/>
    <text x="52" y="365.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">2</text>
    <text x="80" y="352" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">변형</text>
    <text x="80" y="372" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">base에 바꿀 값(override)만 얹는다</text>
    <rect x="24" y="403" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="436.5" r="15" fill="#C49A5A"/>
    <text x="52" y="442.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">3</text>
    <text x="80" y="429" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">실행</text>
    <text x="80" y="449" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">각 시나리오에 모드를 실행해 요약</text>
    <rect x="24" y="480" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="513.5" r="15" fill="#C49A5A"/>
    <text x="52" y="519.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">4</text>
    <text x="80" y="506" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">델타</text>
    <text x="80" y="526" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">baseline 대비 변화량을 읽는다</text>
    <rect x="24" y="561" width="432" height="66" rx="10" fill="#C49A5A"/>
    <text x="38" y="583" text-anchor="start" font-size="13" font-weight="700" fill="#252A30">체크 질문</text>
    <text x="38" y="601" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">한 번에 가정 하나만 바꿨는가?</text>
  </g>
</svg>
