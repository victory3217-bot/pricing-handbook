<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 725" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">From pricing strategy to feasibility</title>
  <desc id="d">Price, cost and margin, and revenue model pass through three financial lenses into business feasibility.</desc>
  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#14253D"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C49A5A"/>
    </marker>
  </defs>
  <g id="background">
    <rect width="480" height="725" rx="14" fill="#F6F2EA"/>
  </g>
  <g id="headline">
    <text x="240" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">Pricing strategy → Business feasibility</text>
  </g>
  <g id="price-p">
    <rect x="40" y="75" width="400" height="78" rx="10" fill="#315B62"/>
    <text x="240" y="110" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Price P</text>
    <text x="240" y="133" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">Customer + value basis</text>
  </g>
  <g id="cost-margin">
    <rect x="40" y="189" width="400" height="78" rx="10" fill="#315B62"/>
    <text x="240" y="224" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Cost · margin structure</text>
    <text x="240" y="247" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">Sustainability</text>
  </g>
  <g id="revenue-model">
    <rect x="40" y="303" width="400" height="78" rx="10" fill="#315B62"/>
    <text x="240" y="338" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Revenue model</text>
    <text x="240" y="361" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">Who pays for what and how?</text>
  </g>
  <g id="three-lenses">
    <rect x="40" y="417" width="400" height="124" rx="10" fill="#14253D"/>
    <text x="240" y="452" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Three financial lenses</text>
    <text x="240" y="475" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">Profit · assets · cash flow</text>
    <text x="240" y="498" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">See different economic</text>
    <text x="240" y="521" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">structures together</text>
  </g>
  <g id="feasibility">
    <rect x="40" y="577" width="400" height="120" rx="10" fill="#C49A5A"/>
    <text x="240" y="619" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">BUSINESS FEASIBILITY</text>
    <text x="240" y="646" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">P × Qty</text>
    <text x="240" y="670" text-anchor="middle" font-size="17" font-weight="400" fill="#252A30">How much can we actually sell?</text>
  </g>
  <g id="flow">
    <line x1="240" y1="155" x2="240" y2="186" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <line x1="240" y1="269" x2="240" y2="300" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <line x1="240" y1="383" x2="240" y2="414" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <line x1="240" y1="543" x2="240" y2="574" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
  </g>
</svg>
