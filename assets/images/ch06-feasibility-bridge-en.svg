<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 594" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">From pricing strategy to feasibility</title>
  <desc id="d">Price P, the cost and margin structure, and the revenue model are three parallel inputs. They are cross-checked through three financial lenses (profit, assets, cash flow) and then handed to business feasibility (P × Qty).</desc>
  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#14253D"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C49A5A"/>
    </marker>
  </defs>
  <g id="background">
    <rect width="480" height="594" rx="14" fill="#F6F2EA"/>
  </g>
  <g id="headline">
    <text x="240" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">Pricing strategy → Business feasibility</text>
  </g>
  <g id="inputs">
  <g id="price-p">
    <rect x="24" y="75" width="136" height="132" rx="10" fill="#315B62"/>
    <text x="92" y="125" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Price P</text>
    <text x="92" y="149" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">Customer +</text>
    <text x="92" y="172" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">value basis</text>
  </g>
  <g id="cost-margin">
    <rect x="172" y="75" width="136" height="132" rx="10" fill="#315B62"/>
    <text x="240" y="110" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Cost ·</text>
    <text x="240" y="137" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">margin</text>
    <text x="240" y="164" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">structure</text>
    <text x="240" y="187" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">Sustainability</text>
  </g>
  <g id="revenue-model">
    <rect x="320" y="75" width="136" height="132" rx="10" fill="#315B62"/>
    <text x="388" y="112" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Revenue</text>
    <text x="388" y="139" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">model</text>
    <text x="388" y="162" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">Who pays for</text>
    <text x="388" y="185" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">what and how?</text>
  </g>
  </g>
  <g id="flow">
    <line x1="92" y1="209" x2="92" y2="256" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <line x1="240" y1="209" x2="240" y2="256" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <line x1="388" y1="209" x2="388" y2="256" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <line x1="240" y1="412" x2="240" y2="443" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
  </g>
  <g id="three-lenses">
    <rect x="40" y="259" width="400" height="151" rx="10" fill="#14253D"/>
    <text x="240" y="294" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Cross-check with</text>
    <text x="240" y="321" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">three financial lenses</text>
    <text x="240" y="344" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">Profit · assets · cash flow</text>
    <text x="240" y="367" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">See different economic</text>
    <text x="240" y="390" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">structures together</text>
  </g>
  <g id="feasibility">
    <rect x="40" y="446" width="400" height="120" rx="10" fill="#C49A5A"/>
    <text x="240" y="488" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">BUSINESS FEASIBILITY</text>
    <text x="240" y="515" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">P × Qty</text>
    <text x="240" y="539" text-anchor="middle" font-size="17" font-weight="400" fill="#252A30">How much can we actually sell?</text>
  </g>
</svg>
