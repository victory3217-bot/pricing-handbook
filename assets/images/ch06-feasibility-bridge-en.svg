<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 760" role="img" aria-labelledby="t d"><title id="t">From pricing strategy to feasibility</title><desc id="d">Price, cost and margin, and revenue model pass through three financial lenses into business feasibility.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#475569"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#0f172a}.h{font-size:21px;font-weight:700}.s{font-size:16px;fill:#475569}.i{fill:#eef2ff;stroke:#6366f1;stroke-width:2}.l{fill:#ecfdf5;stroke:#059669;stroke-width:2}.o{fill:#fef3c7;stroke:#d97706;stroke-width:3}.a{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#a)}</style><rect width="440" height="760" rx="16" fill="#fff"/><text class="h" x="220" y="38" text-anchor="middle">Pricing strategy → Business feasibility</text><g text-anchor="middle"><rect class="i" x="30" y="70" width="380" height="72" rx="12"/><text class="h" x="220" y="100">Price P</text><text class="s" x="220" y="126">Customer + value basis</text><rect class="i" x="30" y="165" width="380" height="72" rx="12"/><text class="h" x="220" y="195">Cost · margin structure</text><text class="s" x="220" y="221">Sustainability</text><rect class="i" x="30" y="260" width="380" height="72" rx="12"/><text class="h" x="220" y="290">Revenue model</text><text class="s" x="220" y="316">Who pays for what and how?</text><rect class="l" x="30" y="395" width="380" height="110" rx="12"/><text class="h" x="220" y="430">Three financial lenses</text><text class="s" x="220" y="462">Profit · assets · cash flow</text><text class="s" x="220" y="488">See different economic structures together</text><rect class="o" x="30" y="570" width="380" height="120" rx="14"/><text class="h" x="220" y="612">BUSINESS FEASIBILITY</text><text class="h" x="220" y="646">P × Qty</text><text class="s" x="220" y="674">How much can we actually sell?</text></g><path class="a" d="M220 142v23"/><path class="a" d="M220 237v23"/><path class="a" d="M220 332v63"/><path class="a" d="M220 505v65"/></svg>
