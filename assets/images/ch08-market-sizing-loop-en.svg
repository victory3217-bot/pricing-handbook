<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 680" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">Iterative effective-market sizing</title>
  <desc id="d">Hypothesis, QCD review, executable model, and market sizing loop back to revised assumptions.</desc>
  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#14253D"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C49A5A"/>
    </marker>
  </defs>
  <g id="background">
    <rect width="480" height="680" rx="14" fill="#F6F2EA"/>
  </g>
  <g id="headline">
    <text x="240" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">Turn qualitative</text>
    <text x="240" y="71" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">hypotheses into numbers</text>
  </g>
  <g id="hypotheses">
    <rect x="40" y="102" width="380" height="78" rx="10" fill="#315B62"/>
    <text x="230" y="137" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">1–3. Build hypotheses</text>
    <text x="230" y="160" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">Segment · target · position</text>
  </g>
  <g id="qcd">
    <rect x="40" y="216" width="380" height="78" rx="10" fill="#C49A5A"/>
    <text x="230" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">4–5. QCD reality check</text>
    <text x="230" y="274" text-anchor="middle" font-size="17" font-weight="400" fill="#252A30">Resource · cost conditions</text>
  </g>
  <g id="model">
    <rect x="40" y="330" width="380" height="78" rx="10" fill="#315B62"/>
    <text x="230" y="365" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">6–8. Finalize the model</text>
    <text x="230" y="388" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">Final target · 4P · BMC</text>
  </g>
  <g id="effective-market">
    <rect x="40" y="444" width="380" height="82" rx="10" fill="#14253D"/>
    <text x="230" y="479" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">9. EFFECTIVE MARKET</text>
    <text x="230" y="506" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">P × Qty</text>
  </g>
  <g id="flow">
    <line x1="230" y1="182" x2="230" y2="213" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <line x1="230" y1="296" x2="230" y2="327" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <line x1="230" y1="410" x2="230" y2="441" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
  </g>
  <g id="return-loop">
    <path d="M420 485 H452 V141 H422" fill="none" stroke="#C49A5A" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow-gold)"/>
  </g>
  <g id="legend">
    <line x1="40" y1="562" x2="84" y2="562" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <text x="96" y="568" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">Solid arrow: progression of the steps</text>
    <line x1="40" y1="602" x2="84" y2="602" stroke="#C49A5A" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow-gold)"/>
    <text x="96" y="608" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">Dashed arrow: if goals and resources</text>
    <text x="96" y="630" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">do not fit, revise assumptions</text>
  </g>
</svg>
