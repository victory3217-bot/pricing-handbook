<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 850" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">가격결정의 두 논리</title>
  <desc id="d">고객가치 기반 가격결정과 경쟁 기반 가격결정은 두 개의 병렬 흐름이며, 두 논리는 서로 배타적이지 않고 함께 가격전략을 만든다. 고객가치 흐름은 고객가치에서 사업성 역산으로, 경쟁 흐름은 진짜 경쟁자 정의에서 경쟁자 가격 비교를 거쳐 포지셔닝으로 이어진다.</desc>
  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#14253D"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C49A5A"/>
    </marker>
  </defs>
  <g id="background">
    <rect width="480" height="850" rx="14" fill="#F6F2EA"/>
  </g>
  <g id="headline">
    <text x="240" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">가치와 경쟁의 교차점에서</text>
    <text x="240" y="71" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">가격을 정한다</text>
  </g>
  <g id="column-headings">
    <text x="128" y="116" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">고객가치 기반</text>
    <text x="352" y="116" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">경쟁 기반</text>
  </g>
  <g id="customer-value">
    <rect x="24" y="134" width="208" height="128" rx="10" fill="#14253D"/>
    <text x="128" y="182" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">고객가치</text>
    <text x="128" y="206" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">지불의사 ·</text>
    <text x="128" y="229" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">수용가격대</text>
  </g>
  <g id="reverse-economics">
    <rect x="24" y="298" width="208" height="128" rx="10" fill="#14253D"/>
    <text x="128" y="346" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">사업성 역산</text>
    <text x="128" y="370" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">원가 · 상품구성</text>
    <text x="128" y="393" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">검토</text>
  </g>
  <g id="true-competitors">
    <rect x="248" y="134" width="208" height="128" rx="10" fill="#315B62"/>
    <text x="352" y="182" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">진짜 경쟁자</text>
    <text x="352" y="206" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">같은 고객 ·</text>
    <text x="352" y="229" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">유사 가치</text>
  </g>
  <g id="competitor-prices">
    <rect x="248" y="298" width="208" height="128" rx="10" fill="#315B62"/>
    <text x="352" y="346" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">경쟁자 가격 비교</text>
    <text x="352" y="370" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">업계 평균을 그대로</text>
    <text x="352" y="393" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">복사하지 않는다</text>
  </g>
  <g id="positioning">
    <rect x="248" y="462" width="208" height="128" rx="10" fill="#315B62"/>
    <text x="352" y="510" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">포지셔닝</text>
    <text x="352" y="534" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">가격이 보내는</text>
    <text x="352" y="557" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">시장 신호</text>
  </g>
  <g id="flow">
    <line x1="128" y1="264" x2="128" y2="295" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <line x1="352" y1="264" x2="352" y2="295" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <line x1="352" y1="428" x2="352" y2="459" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <line x1="128" y1="428" x2="128" y2="635" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <line x1="352" y1="592" x2="352" y2="635" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
  </g>
  <g id="pricing-strategy">
    <rect x="40" y="638" width="400" height="100" rx="10" fill="#C49A5A"/>
    <text x="240" y="684" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">가격전략</text>
    <text x="240" y="707" text-anchor="middle" font-size="17" font-weight="400" fill="#252A30">고객가치 × 경쟁 포지션</text>
  </g>
  <g id="caption">
    <text x="240" y="782" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">두 논리는 서로 배타적이지 않다</text>
  </g>
</svg>
