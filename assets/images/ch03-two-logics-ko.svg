<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 682" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">가격결정의 두 논리</title>
  <desc id="d">고객가치와 경쟁 포지셔닝이 가격전략에서 만난다.</desc>
  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#14253D"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C49A5A"/>
    </marker>
  </defs>
  <g id="background">
    <rect width="480" height="682" rx="14" fill="#F6F2EA"/>
  </g>
  <g id="headline">
    <text x="240" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">가치와 경쟁의 교차점에서</text>
    <text x="240" y="71" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">가격을 정한다</text>
  </g>
  <g id="customer-value">
    <rect x="40" y="102" width="400" height="78" rx="10" fill="#14253D"/>
    <text x="240" y="137" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">고객가치</text>
    <text x="240" y="160" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">지불의사 · 수용가격대</text>
  </g>
  <g id="reverse-economics">
    <rect x="40" y="216" width="400" height="78" rx="10" fill="#14253D"/>
    <text x="240" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">사업성 역산</text>
    <text x="240" y="274" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">원가 · 상품구성 검토</text>
  </g>
  <g id="true-competitors">
    <rect x="40" y="330" width="400" height="78" rx="10" fill="#315B62"/>
    <text x="240" y="365" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">진짜 경쟁자</text>
    <text x="240" y="388" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">같은 고객 · 유사 가치</text>
  </g>
  <g id="positioning">
    <rect x="40" y="444" width="400" height="78" rx="10" fill="#315B62"/>
    <text x="240" y="479" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">포지셔닝</text>
    <text x="240" y="502" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">가격이 보내는 시장 신호</text>
  </g>
  <g id="pricing-strategy">
    <rect x="40" y="558" width="400" height="96" rx="10" fill="#C49A5A"/>
    <text x="240" y="602" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">가격전략</text>
    <text x="240" y="625" text-anchor="middle" font-size="17" font-weight="400" fill="#252A30">고객가치 × 경쟁 포지션</text>
  </g>
  <g id="flow">
    <line x1="240" y1="182" x2="240" y2="213" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <line x1="240" y1="296" x2="240" y2="327" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <line x1="240" y1="410" x2="240" y2="441" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <line x1="240" y1="524" x2="240" y2="555" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
  </g>
</svg>
