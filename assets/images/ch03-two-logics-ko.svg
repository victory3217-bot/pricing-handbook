<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 720" role="img" aria-labelledby="t d"><title id="t">가격결정의 두 논리</title><desc id="d">고객가치와 경쟁 포지셔닝이 가격전략에서 만난다.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#475569"/></marker></defs><style>text{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;fill:#0f172a}.h{font-size:21px;font-weight:700}.s{font-size:16px;fill:#475569}.v{fill:#ecfdf5;stroke:#059669;stroke-width:2}.c{fill:#eef2ff;stroke:#6366f1;stroke-width:2}.p{fill:#fef3c7;stroke:#d97706;stroke-width:3}.l{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#a)}</style><rect width="440" height="720" rx="16" fill="#fff"/><text class="h" x="220" y="38" text-anchor="middle">가치와 경쟁의 교차점에서 가격을 정한다</text><g text-anchor="middle"><rect class="v" x="30" y="75" width="380" height="82" rx="12"/><text class="h" x="220" y="109">고객가치</text><text class="s" x="220" y="137">지불의사 · 수용가격대</text><rect class="v" x="30" y="190" width="380" height="82" rx="12"/><text class="h" x="220" y="224">사업성 역산</text><text class="s" x="220" y="252">원가 · 상품구성 검토</text><rect class="c" x="30" y="335" width="380" height="82" rx="12"/><text class="h" x="220" y="369">진짜 경쟁자</text><text class="s" x="220" y="397">같은 고객 · 유사 가치</text><rect class="c" x="30" y="450" width="380" height="82" rx="12"/><text class="h" x="220" y="484">포지셔닝</text><text class="s" x="220" y="512">가격이 보내는 시장 신호</text><rect class="p" x="30" y="585" width="380" height="92" rx="14"/><text class="h" x="220" y="625">가격전략</text><text class="s" x="220" y="653">고객가치 × 경쟁 포지션</text></g><path class="l" d="M220 157v33M220 272v63M220 417v33M220 532v53"/></svg>
