<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 741" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">CH14 Summary: Scenario Compare</title>
  <desc id="d">Scenario comparison does not recommend the answer; it shows how changing one assumption alters the numbers against a common baseline. 1. Baseline: Fix one baseline scenario. 2. Variation: Layer only the changed values (override) on base. 3. Run: Run the modes for each scenario and summarize. 4. Delta: Read the change against the baseline. Check question: Did we change only one assumption at a time?</desc>
  <g id="background">
    <rect width="480" height="741" rx="14" fill="#F6F2EA"/>
  </g>
  <g id="summary">
    <rect x="24" y="24" width="432" height="77" rx="10" fill="#14253D"/>
    <text x="38" y="50" text-anchor="start" font-size="14" font-weight="700" fill="#C49A5A">CH14</text>
    <text x="38" y="74" text-anchor="start" font-size="20" font-weight="700" fill="#FFFFFF">Scenario Compare</text>
    <rect x="24" y="115" width="432" height="144" rx="10" fill="#315B62"/>
    <text x="38" y="137" text-anchor="start" font-size="13" font-weight="700" fill="#C49A5A">Key message</text>
    <text x="38" y="159" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">Scenario comparison does not</text>
    <text x="38" y="183" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">recommend the answer; it shows how</text>
    <text x="38" y="207" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">changing one assumption alters the</text>
    <text x="38" y="231" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">numbers against a common baseline.</text>
    <rect x="24" y="273" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="306.5" r="15" fill="#C49A5A"/>
    <text x="52" y="312.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">1</text>
    <text x="80" y="299" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Baseline</text>
    <text x="80" y="319" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">Fix one baseline scenario</text>
    <rect x="24" y="350" width="432" height="88" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="394" r="15" fill="#C49A5A"/>
    <text x="52" y="400" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">2</text>
    <text x="80" y="376" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Variation</text>
    <text x="80" y="396" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">Layer only the changed</text>
    <text x="80" y="417" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">values (override) on base</text>
    <rect x="24" y="448" width="432" height="88" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="492" r="15" fill="#C49A5A"/>
    <text x="52" y="498" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">3</text>
    <text x="80" y="474" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Run</text>
    <text x="80" y="494" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">Run the modes for each</text>
    <text x="80" y="515" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">scenario and summarize</text>
    <rect x="24" y="546" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="579.5" r="15" fill="#C49A5A"/>
    <text x="52" y="585.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">4</text>
    <text x="80" y="572" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Delta</text>
    <text x="80" y="592" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">Read the change against the baseline</text>
    <rect x="24" y="627" width="432" height="90" rx="10" fill="#C49A5A"/>
    <text x="38" y="649" text-anchor="start" font-size="13" font-weight="700" fill="#252A30">Check question</text>
    <text x="38" y="667" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Did we change only one</text>
    <text x="38" y="691" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">assumption at a time?</text>
  </g>
</svg>
