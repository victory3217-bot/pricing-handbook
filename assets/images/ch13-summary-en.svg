<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 720" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">CH13 Summary: BEP — Break-Even Point</title>
  <desc id="d">A positive unit margin does not make a viable business unless the sales volume needed to recover fixed costs is achievable. 1. CMu: Unit contribution margin = net sales − direct cost − variable cost. 2. FC: Sum of fixed operating costs. 3. Q_BEP: Break-even volume = FC ÷ CMu. 4. Volume profit: Is there profit at the planned volume?. Check question: Does planned volume exceed break-even volume?</desc>
  <g id="background">
    <rect width="480" height="720" rx="14" fill="#F6F2EA"/>
  </g>
  <g id="summary">
    <rect x="24" y="24" width="432" height="77" rx="10" fill="#14253D"/>
    <text x="38" y="50" text-anchor="start" font-size="14" font-weight="700" fill="#C49A5A">CH13</text>
    <text x="38" y="74" text-anchor="start" font-size="20" font-weight="700" fill="#FFFFFF">BEP — Break-Even Point</text>
    <rect x="24" y="115" width="432" height="144" rx="10" fill="#315B62"/>
    <text x="38" y="137" text-anchor="start" font-size="13" font-weight="700" fill="#C49A5A">Key message</text>
    <text x="38" y="159" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">A positive unit margin does not</text>
    <text x="38" y="183" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">make a viable business unless the</text>
    <text x="38" y="207" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">sales volume needed to recover</text>
    <text x="38" y="231" text-anchor="start" font-size="17" font-weight="400" fill="#FFFFFF">fixed costs is achievable.</text>
    <rect x="24" y="273" width="432" height="88" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="317" r="15" fill="#C49A5A"/>
    <text x="52" y="323" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">1</text>
    <text x="80" y="299" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">CMu</text>
    <text x="80" y="319" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">Unit contribution margin = net</text>
    <text x="80" y="340" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">sales − direct cost − variable cost</text>
    <rect x="24" y="371" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="404.5" r="15" fill="#C49A5A"/>
    <text x="52" y="410.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">2</text>
    <text x="80" y="397" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">FC</text>
    <text x="80" y="417" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">Sum of fixed operating costs</text>
    <rect x="24" y="448" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="481.5" r="15" fill="#C49A5A"/>
    <text x="52" y="487.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">3</text>
    <text x="80" y="474" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Q_BEP</text>
    <text x="80" y="494" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">Break-even volume = FC ÷ CMu</text>
    <rect x="24" y="525" width="432" height="67" rx="10" fill="#FFFFFF" stroke="#315B62" stroke-width="1.5"/>
    <circle cx="52" cy="558.5" r="15" fill="#C49A5A"/>
    <text x="52" y="564.5" text-anchor="middle" font-size="17" font-weight="700" fill="#252A30">4</text>
    <text x="80" y="551" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Volume profit</text>
    <text x="80" y="571" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">Is there profit at the planned volume?</text>
    <rect x="24" y="606" width="432" height="90" rx="10" fill="#C49A5A"/>
    <text x="38" y="628" text-anchor="start" font-size="13" font-weight="700" fill="#252A30">Check question</text>
    <text x="38" y="646" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">Does planned volume</text>
    <text x="38" y="670" text-anchor="start" font-size="17" font-weight="700" fill="#252A30">exceed break-even volume?</text>
  </g>
</svg>
